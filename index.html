<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>泡泡IM · BubbleIM</title>
    <!-- <link rel="stylesheet" href="theme.css"> -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        /* ============ THEME TOKENS ============ */
        :root{
        --radius-lg:18px;
        --radius-md:12px;
        --radius-sm:9px;
        --font: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
        }
        html[data-theme="dark"]{
        --bg-app:#0B0E16;
        --bg-panel:#141926;
        --bg-elevated:#1B2233;
        --bg-hover:#212A3F;
        --border:#252E44;
        --text-main:#EDEFF6;
        --text-sub:#8890A6;
        --text-faint:#5B6379;
        --accent-gold:#E4B54A;
        --accent-gold-soft:#F5D687;
        --accent-primary:#4C86E0;
        --bubble-sent:#3E68B0;
        --bubble-sent-text:#F5F8FF;
        --bubble-recv:#1C2436;
        --bubble-recv-text:#E7E9F2;
        --danger:#E5646B;
        --online:#3FCB7C;
        --shadow: 0 10px 30px rgba(0,0,0,.5);
        --sheet-bg:#171E2E;
        }
        html[data-theme="light"]{
        --bg-app:#EEF0F5;
        --bg-panel:#FFFFFF;
        --bg-elevated:#F4F5F9;
        --bg-hover:#EBEDF5;
        --border:#E3E6EF;
        --text-main:#181C27;
        --text-sub:#767C8C;
        --text-faint:#A6ABB8;
        --accent-gold:#C9891F;
        --accent-gold-soft:#E4B54A;
        --accent-primary:#3D6FCB;
        --bubble-sent:#3D6FCB;
        --bubble-sent-text:#FFFFFF;
        --bubble-recv:#FFFFFF;
        --bubble-recv-text:#181C27;
        --danger:#D6444C;
        --online:#2FA968;
        --shadow: 0 10px 26px rgba(20,25,40,.12);
        --sheet-bg:#FFFFFF;
        }

        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        html,body{height:100%;margin:0;overscroll-behavior:none;}
        body{
        font-family:var(--font);
        background:var(--bg-app);
        color:var(--text-main);
        transition:background .2s ease,color .2s ease;
        }
        ::-webkit-scrollbar{width:6px;height:6px;}
        ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
        button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit;}
        input,textarea{font-family:inherit;}
        .icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;}
        .icon.filled{fill:currentColor;stroke:none;}

        #app-window{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100vw;overflow:hidden;background:var(--bg-app);position:relative;}
        .desktop-shell{flex:1;display:flex;min-height:0;}

        /* ---- Brand rail (desktop only) ---- */
        .brand-rail{
        width:76px;flex:0 0 76px;background:var(--bg-panel);border-right:1px solid var(--border);
        display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:22px;
        }
        .brand-logo{
        width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,var(--accent-gold-soft),var(--accent-gold));
        display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);color:#171717;
        }
        .brand-logo .icon{width:25px;height:25px;}
        .rail-nav{display:flex;flex-direction:column;gap:10px;}
        .rail-btn{
        width:46px;height:46px;border-radius:var(--radius-sm);color:var(--text-sub);
        display:flex;align-items:center;justify-content:center;position:relative;transition:background .15s,color .15s;
        }
        .rail-btn:hover{background:var(--bg-hover);}
        .rail-btn.active{background:var(--bg-hover);color:var(--accent-gold);}
        .rail-badge{
        position:absolute;top:0;right:2px;background:var(--danger);color:#fff;font-size:10px;
        min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;
        }
        .rail-spacer{flex:1;}
        .icon-toggle{
        width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--bg-elevated);
        color:var(--text-sub);display:flex;align-items:center;justify-content:center;
        }
        .icon-toggle:hover{color:var(--accent-gold);}

        /* ---- Content panel (wraps main chat panel + overlay screens so they share the
            same right-hand slot; list-panel / brand-rail stay visible beside it) ---- */
        .content-panel{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;}

        /* ---- List panel (secondary menu) ---- */
        .list-panel{width:320px;flex:0 0 320px;background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;transition:width .18s ease,flex-basis .18s ease;}
        .list-panel.collapsed{width:0;flex:0 0 0;border-right:none;overflow:hidden;}
        .list-header{padding:16px 16px 10px;flex:0 0 auto;}
        .list-title{font-size:19px;font-weight:800;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
        .icon-btn-round{width:30px;height:30px;border-radius:9px;background:var(--bg-elevated);color:var(--text-sub);display:flex;align-items:center;justify-content:center;}
        .icon-btn-round:hover{color:var(--accent-gold);}
        .search-box{background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--text-sub);display:flex;gap:7px;align-items:center;}
        .search-box .icon{width:16px;height:16px;}
        .search-box input{background:transparent;border:none;outline:none;flex:1;color:var(--text-main);font-size:13px;}
        .list-scroll{flex:1;overflow-y:auto;min-height:0;}
        /* 窄屏下点击搜索图标后展开的整行搜索模式（需求1），以及对应的“取消”文字按钮 */
        .search-row-active{display:flex;align-items:center;gap:10px;}
        .text-btn{color:var(--accent-gold);font-size:13.5px;font-weight:600;white-space:nowrap;flex:0 0 auto;}
        /* 通讯录里“群聊”展开后的子列表：整体略微缩进、背景与好友行区分，末尾的“发起群聊”用强调色区分（需求5） */
        .group-sublist{background:var(--bg-elevated);}
        .contact-row.group-sub{padding-left:28px;}
        .contact-row.group-sub.start-group-row{border-top:1px solid var(--border);color:var(--accent-gold);}
        .contact-row.group-sub.start-group-row .conv-name{color:var(--accent-gold);font-weight:600;}

        .conv-item{display:flex;align-items:center;padding:0 16px;cursor:pointer;transition:background .12s;position:relative;overflow:hidden;}
        .conv-item:hover{background:var(--bg-hover);}
        .conv-item.active{background:var(--bg-hover);}
        .conv-item.active::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent-gold);}
        /* .conv-main 承载头像/名称/预览等实际内容；向左滑动时它整体左移，给右侧置顶/删除按钮腾出空间，
        而不是让按钮悬浮盖住文字（修复需求6提到的 bug） */
        .conv-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:12px 0;transition:transform .18s;}
        .conv-item.swiped .conv-main{transform:translateX(-132px);}
        .avatar{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;color:#fff;flex:0 0 auto;position:relative;box-shadow:var(--shadow);background-size:cover;background-position:center;}
        .avatar.small{width:34px;height:34px;border-radius:10px;font-size:16px;box-shadow:none;}
        .avatar.xsmall{width:26px;height:26px;border-radius:8px;font-size:13px;box-shadow:none;}
        .avatar.large{width:76px;height:76px;border-radius:20px;font-size:34px;}
        .badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700;border:2px solid var(--bg-panel);}
        .conv-mid{flex:1;min-width:0;}
        .conv-name-row{display:flex;justify-content:space-between;align-items:baseline;}
        .conv-name{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .conv-time{font-size:11px;color:var(--text-faint);flex:0 0 auto;margin-left:6px;}
        .conv-last{font-size:12.5px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
        .pill{font-size:9.5px;padding:2px 6px;border-radius:6px;background:var(--accent-gold);color:#171717;font-weight:700;margin-left:6px;vertical-align:1px;}
        .swipe-actions{position:absolute;right:0;top:0;bottom:0;display:flex;transform:translateX(100%);transition:transform .18s;}
        .conv-item.swiped .swipe-actions{transform:translateX(0);}
        .swipe-btn{width:66px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:600;}
        .swipe-btn.pin{background:#8A90A0;}
        .swipe-btn.del{background:var(--danger);}

        .section-label{padding:10px 16px 5px;font-size:11.5px;color:var(--text-faint);font-weight:700;letter-spacing:.02em;}
        .contact-row{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;}
        .contact-row:hover{background:var(--bg-hover);}
        .func-icon{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;}

        /* ---- Main chat panel ---- */
        .main-panel{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-app);min-height:0;}
        .chat-header{flex:0 0 auto;background:var(--bg-panel);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;}
        .chat-header .name-block .title{font-size:15px;font-weight:700;}
        .chat-header .name-block .sub{font-size:11.5px;color:var(--text-sub);}
        .chat-header .name-block{flex:1;min-width:0;}
        .chat-header .icon-btn-round{flex:0 0 auto;}
        .chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-sub);gap:12px;}
        .chat-empty .big-logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(145deg,var(--accent-gold-soft),var(--accent-gold));display:flex;align-items:center;justify-content:center;font-size:32px;}

        .messages{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-height:0;}
        .msg-row{display:flex;gap:9px;align-items:flex-end;}
        .msg-row.me{flex-direction:row-reverse;}
        .msg-col{display:flex;flex-direction:column;max-width:66%;min-width:0;}
        .msg-meta{font-size:11px;color:var(--text-tertiary,#999);margin:0 4px 3px;}
        .msg-row.me .msg-meta{text-align:right;}
        .msg-row.me .msg-col{align-items:flex-end;}
        .msg-name{font-size:11px;color:var(--text-sub);margin-bottom:4px;padding:0 2px;}
        .bubble{border-radius:var(--radius-md);padding:9px 13px;font-size:14.5px;line-height:1.55;word-break:break-word;}
        .bubble.recv{background:var(--bubble-recv);color:var(--bubble-recv-text);border:1px solid var(--border);border-bottom-left-radius:4px;}
        .bubble.sent{background:var(--bubble-sent);color:var(--bubble-sent-text);border-bottom-right-radius:4px;}
        .bubble.system{align-self:center;color:var(--text-faint);font-size:11.5px;background:transparent;padding:2px 0;}
        .bubble.voice{display:flex;align-items:center;gap:9px;cursor:pointer;min-width:56px;}
        .bubble.voice .dur{font-size:12.5px;opacity:.9;}
        .voice-wave{display:flex;gap:2.5px;align-items:center;height:16px;}
        .voice-wave span{width:3px;border-radius:2px;background:currentColor;opacity:.85;height:6px;}
        .voice-wave.playing span{animation:wave .8s infinite ease-in-out;}
        .voice-wave span:nth-child(2){animation-delay:.12s;height:14px;}
        .voice-wave span:nth-child(3){animation-delay:.24s;height:10px;}
        .voice-wave span:nth-child(4){animation-delay:.36s;height:15px;}
        @keyframes wave{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1.25)}}
        .bubble.image{padding:4px;cursor:pointer;}
        .bubble.image img{max-width:230px;max-height:230px;border-radius:8px;display:block;}
        .ephemeral-tag{font-size:10px;color:var(--accent-gold);margin-top:3px;padding:0 2px;}

        /* ---- Input bar ---- */
        .input-bar{flex:0 0 auto;background:var(--bg-panel);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);}
        .input-toolbar{display:flex;align-items:center;gap:16px;padding:9px 16px 0;color:var(--text-sub);}
        .tool-btn{color:var(--text-sub);display:flex;}
        .tool-btn:hover{color:var(--accent-gold);}
        .input-row{padding:8px 14px 14px;display:flex;align-items:flex-end;gap:9px;}
        .input-row textarea{flex:1;border:1px solid var(--border);background:var(--bg-elevated);border-radius:11px;padding:10px 12px;font-size:14.5px;color:var(--text-main);resize:none;max-height:90px;min-height:40px;outline:none;}
        .send-btn{background:var(--accent-gold);color:#171717;border-radius:10px;padding:9px 18px;font-weight:700;font-size:13.5px;}
        .send-btn:disabled{background:var(--border);color:var(--text-faint);}
        .hold-btn{flex:1;background:var(--bg-elevated);border:1px solid var(--border);border-radius:11px;padding:10px 0;text-align:center;font-size:14px;font-weight:600;user-select:none;}
        .hold-btn.recording{background:#3A2E1B;border-color:var(--accent-gold);color:var(--accent-gold-soft);}
        html[data-theme="light"] .hold-btn.recording{background:#FCEFCF;}
        .emoji-panel{display:none;grid-template-columns:repeat(8,1fr);gap:4px;padding:10px 14px 14px;border-top:1px solid var(--border);max-height:190px;overflow-y:auto;}
        .emoji-panel.open{display:grid;}
        .emoji-panel span{font-size:20px;text-align:center;padding:5px 0;border-radius:7px;cursor:pointer;}
        .emoji-panel span:hover{background:var(--bg-hover);}
        .hidden{display:none !important;}

        /* recording overlay */
        .record-overlay{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--sheet-bg);border:1px solid var(--border);border-radius:16px;padding:18px 26px;display:none;flex-direction:column;align-items:center;gap:10px;z-index:60;box-shadow:var(--shadow);min-width:160px;}
        .record-overlay.show{display:flex;}
        .record-overlay .rec-dot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite;}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        .record-overlay .rec-bars{display:flex;gap:3px;align-items:center;height:28px;}
        .record-overlay .rec-bars span{width:4px;border-radius:2px;background:var(--accent-gold);height:6px;transition:height .08s;}
        .record-overlay .rec-time{font-size:13px;color:var(--text-sub);}
        .record-overlay .rec-hint{font-size:11.5px;color:var(--text-faint);}
        .record-overlay.cancel .rec-hint{color:var(--danger);}

        /* ---- Bottom sheet / action sheet ---- */
        .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:70;}
        .sheet-overlay.open{display:block;}
        .action-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--sheet-bg);border-radius:18px 18px 0 0;padding:8px 14px calc(14px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease;z-index:71;max-width:420px;margin:0 auto;}
        .action-sheet.open{transform:translateY(0);}
        .sheet-item{display:flex;align-items:center;gap:14px;padding:14px 6px;font-size:15px;font-weight:500;border-bottom:1px solid var(--border);}
        .sheet-item:last-of-type{border-bottom:none;}
        .sheet-item .func-icon{width:38px;height:38px;}
        .sheet-cancel{margin-top:8px;text-align:center;padding:13px 0;font-size:15px;color:var(--text-sub);background:var(--bg-elevated);border-radius:12px;}

        /* ---- Modal (confirm dialogs, QR view) ---- */
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:80;padding:20px;}
        .modal-overlay.open{display:flex;}
        .modal-card{background:var(--sheet-bg);border-radius:18px;padding:24px;max-width:340px;width:100%;box-shadow:var(--shadow);}
        .modal-card .modal-title{font-size:16px;font-weight:700;margin-bottom:6px;text-align:center;}
        .modal-card .modal-body{font-size:13.5px;color:var(--text-sub);text-align:center;margin-bottom:18px;}
        .modal-actions{display:flex;gap:10px;}
        .modal-actions button{flex:1;padding:11px 0;border-radius:10px;font-size:14px;font-weight:600;}
        .modal-actions .btn-cancel{background:var(--bg-elevated);color:var(--text-main);}
        .modal-actions .btn-confirm{background:var(--accent-gold);color:#171717;}

        /* ---- Full screens (chat/addfriend/scan/newgroup/qrcode/settings) ---- */
        .screen{position:absolute;inset:0;background:var(--bg-app);display:flex;flex-direction:column;z-index:10;}
        .screen-header{flex:0 0 auto;background:var(--bg-panel);border-bottom:1px solid var(--border);padding:13px 16px;display:flex;align-items:center;gap:10px;}
        .screen-header .title{font-size:16px;font-weight:700;flex:1;text-align:center;margin-right:30px;}
        .screen-body{flex:1;overflow-y:auto;padding:18px;}
        .screen-body.no-pad{padding:0;}

        .profile-hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 0 8px;}
        .profile-hero .uid{font-size:12.5px;color:var(--text-sub);}
        .profile-hero .nickname{font-size:18px;font-weight:700;}

        .card{background:var(--bg-panel);border-radius:14px;overflow:hidden;border:1px solid var(--border);}
        .card-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;gap:10px;}
        .card-row:last-child{border-bottom:none;}
        .card-row .val{color:var(--text-sub);display:flex;align-items:center;gap:8px;font-size:13.5px;}
        .card-row .arrow{color:var(--text-faint);}
        .editable-input{border:none;background:transparent;text-align:right;font-size:14px;color:var(--text-sub);outline:none;width:60%;}

        .toggle{width:44px;height:25px;border-radius:13px;background:var(--border);position:relative;transition:background .15s;flex:0 0 auto;}
        .toggle.on{background:var(--accent-gold);}
        .toggle::after{content:'';position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
        .toggle.on::after{left:21px;}
        .seg-control{display:flex;background:var(--bg-elevated);border-radius:10px;padding:3px;gap:3px;}
        .seg-btn{flex:1;text-align:center;padding:7px 0;border-radius:8px;font-size:12.5px;color:var(--text-sub);}
        .seg-btn.active{background:var(--accent-gold);color:#171717;font-weight:700;}

        .qr-frame{background:#fff;border-radius:16px;padding:18px;display:flex;align-items:center;justify-content:center;margin:0 auto;width:216px;height:216px;}
        .qr-frame svg{width:100%;height:100%;}

        .friend-row{display:flex;align-items:center;gap:12px;padding:11px 4px;}
        .friend-row .fname{flex:1;font-size:14px;font-weight:500;}
        .pill-btn{border-radius:9px;padding:7px 15px;font-size:12.5px;font-weight:700;}
        .pill-btn.view{background:var(--accent-gold);color:#171717;}
        .pill-btn.done{background:var(--bg-elevated);color:var(--text-faint);}
        .field-box{background:var(--bg-panel);border:1px solid var(--border);border-radius:11px;padding:10px 14px;font-size:13.5px;display:flex;gap:8px;align-items:center;margin-bottom:14px;}
        .field-box input{border:none;outline:none;background:transparent;flex:1;color:var(--text-main);font-size:13.5px;}

        .select-row{display:flex;align-items:center;gap:12px;padding:10px 4px;}
        .checkbox{width:21px;height:21px;border-radius:50%;border:2px solid var(--border);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;}
        .checkbox.checked{background:var(--accent-gold);border-color:var(--accent-gold);color:#171717;}
        .done-btn{background:var(--accent-gold);color:#171717;border-radius:9px;padding:7px 15px;font-size:13px;font-weight:700;}
        .done-btn:disabled{background:var(--border);color:var(--text-faint);}

        .scan-video-wrap{flex:1;position:relative;background:#000;overflow:hidden;}
        .scan-video-wrap video{width:100%;height:100%;object-fit:cover;}
        .scan-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64%;max-width:260px;aspect-ratio:1;border:2px solid var(--accent-gold);border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.45);}
        .scan-hint{position:absolute;bottom:14%;left:0;right:0;text-align:center;color:#fff;font-size:13px;}
        .scan-fallback{padding:14px;color:var(--text-faint);font-size:12px;text-align:center;}
        .scan-fallback textarea{width:100%;margin-top:8px;border-radius:9px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-main);padding:8px;font-size:12px;}

        /* ---- Bottom tab bar (mobile) ---- */
        .tabbar{display:none;}
        @media (max-width:900px){
        .brand-rail{display:none;}
        .desktop-shell{position:relative;}
        .list-panel{width:100%;flex:1;border-right:none;}
        .main-panel, .screen.root-level{position:absolute;inset:0;transform:translateX(100%);transition:transform .22s ease;z-index:20;}
        .main-panel.open, .screen.root-level.open{transform:translateX(0);}
        .tabbar{
            display:flex;flex:0 0 58px;background:var(--bg-panel);border-top:1px solid var(--border);
            padding-bottom:env(safe-area-inset-bottom);
        }
        .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-faint);font-size:10px;position:relative;padding-top:6px;}
        .tab-item .icon{width:23px;height:23px;}
        .tab-item.active{color:var(--accent-gold);}
        .tab-badge{position:absolute;top:2px;right:24%;background:var(--danger);color:#fff;font-size:9px;min-width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
        }
        @media (min-width:901px){
        .main-panel{position:relative;transform:none;}
        /* 桌面版也需要显示返回按钮，否则加好友/发起群聊/群资料等屏幕无法返回（需求5/6/7） */
        .mobile-plus-btn{display:none;}
        }

        /* ---- 文件消息气泡（需求3） ---- */
        .bubble.file{display:flex;align-items:center;gap:10px;min-width:180px;max-width:260px;cursor:pointer;}
        .bubble.file .file-ic{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;}
        .bubble.file .file-ic .icon{width:18px;height:18px;}
        .bubble.file .file-meta{min-width:0;flex:1;}
        .bubble.file .file-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .bubble.file .file-size{font-size:11.5px;opacity:.75;margin-top:2px;}

        /* ---- Auth overlay (req 1) ---- */
        .auth-overlay{
        position:fixed;inset:0;z-index:200;background:rgba(8,10,18,.72);
        display:flex;align-items:center;justify-content:center;padding:20px;
        backdrop-filter:blur(8px);
        }
        .auth-card{
        background:var(--sheet-bg);border-radius:20px;padding:28px 24px 22px;
        width:100%;max-width:360px;box-shadow:var(--shadow);
        display:flex;flex-direction:column;align-items:center;gap:12px;
        border:1px solid var(--border);
        }
        .auth-logo{
        width:56px;height:56px;border-radius:16px;
        background:linear-gradient(145deg,var(--accent-gold-soft),var(--accent-gold));
        display:flex;align-items:center;justify-content:center;color:#171717;
        box-shadow:var(--shadow);
        }
        .auth-logo .icon{width:30px;height:30px;}
        .auth-title{font-size:18px;font-weight:800;margin:4px 0 6px;}
        .auth-user-preview{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:4px;}
        .auth-nickname{font-size:16px;font-weight:700;}
        .auth-select{
        width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
        background:var(--bg-elevated);color:var(--text-main);font-size:14px;outline:none;
        }
        .auth-submit{width:100%;padding:12px;margin-top:4px;}
        .auth-link{
        background:none;border:none;color:var(--accent-gold);font-size:13px;font-weight:600;
        padding:8px;cursor:pointer;
        }
        .auth-error{color:var(--danger);font-size:12.5px;min-height:18px;text-align:center;width:100%;}
        .auth-hint{font-size:11.5px;color:var(--text-faint);text-align:center;line-height:1.45;max-width:280px;}
        .auth-empty{font-size:13.5px;color:var(--text-sub);text-align:center;padding:10px 0;}
        .auth-avatar-pick{margin:4px 0 8px;}

        /* ---- Inline list header (req 4) ---- */
        .list-header-inline{
        display:flex;align-items:center;gap:10px;padding:14px 14px 10px;
        }
        .list-title-inline{
        font-size:17px;font-weight:800;flex:0 0 auto;white-space:nowrap;
        }
        .header-search{min-width:0;}

        /* ---- Group avatar badge (req 7) ---- */
        .avatar-wrap{position:relative;flex:0 0 auto;}
        .avatar-group-badge{
        position:absolute;bottom:-2px;right:-4px;
        background:var(--accent-primary);color:#fff;
        font-size:9px;font-weight:700;line-height:1;
        padding:2px 4px;border-radius:4px;
        border:1.5px solid var(--bg-panel);
        letter-spacing:.02em;
        }
        .avatar-group-badge.sm{font-size:8px;padding:1px 3px;}

        /* ---- Copy button on Me page (req 6) ---- */
        .copy-btn{
        display:inline-flex;align-items:center;justify-content:center;
        width:22px;height:22px;margin-left:6px;vertical-align:middle;
        color:var(--text-faint);border-radius:6px;
        }
        .copy-btn .icon{width:14px;height:14px;}
        .copy-btn:hover{color:var(--accent-gold);background:var(--bg-hover);}
        .copy-btn.copied{color:var(--online);}
        #me-uid-row{display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:wrap;}

        /* ---- Group member cell (req 8) ---- */
        .member-cell{
        display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;
        }
        .member-name{
        font-size:11px;color:var(--text-sub);max-width:52px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
        }

        /* mobile: keep inline header compact */
        @media (max-width:900px){
        .list-header-inline{padding:12px 12px 8px;}
        .list-title-inline{font-size:16px;}
        .header-search{padding:7px 10px;}
        }

        /* ---- Group TTL warning on create (req 5) ---- */
        .group-ttl-warn{
        font-size:12px;line-height:1.5;color:var(--accent-gold);
        background:rgba(228,181,74,.12);border:1px solid rgba(228,181,74,.35);
        border-radius:10px;padding:10px 12px;margin-bottom:14px;
        }

        /* ---- Auth left-right form layout ---- */
        .auth-form-row{
        display:flex;align-items:center;gap:16px;width:100%;
        margin:4px 0 2px;
        }
        .auth-avatar-col{
        flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;
        cursor:pointer;user-select:none;
        }
        .auth-avatar-col .avatar.large{width:72px;height:72px;border-radius:20px;font-size:32px;}
        .auth-avatar-tip{font-size:11px;color:var(--text-faint);text-align:center;max-width:72px;line-height:1.3;}
        .auth-fields-col{
        flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;
        }
        .auth-fields-col .field-box{margin-bottom:0;}
        .auth-fields-col .auth-nickname{
        font-size:16px;font-weight:700;padding:4px 2px 2px;
        }
        .auth-fields-col .auth-select{width:100%;}

        /* Avatar picker must sit above auth overlay (z-index 200) */
        .avatar-picker-overlay{z-index:300 !important;}
        .avatar-picker-grid{
        display:grid !important;grid-template-columns:repeat(6,1fr);gap:6px;
        border:none;padding:6px 0 14px;max-height:220px;overflow-y:auto;
        }
        .avatar-picker-grid span{
        font-size:26px;text-align:center;padding:8px 0;border-radius:10px;cursor:pointer;
        }
        .avatar-picker-grid span:hover{background:var(--bg-hover);}


    </style>

  let el = document.getElementById('toast-el');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast-el';
    el.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(20,20,20,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:9999;max-width:80vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.opacity = '0'; }, 2200);
}

/* Returns a best-effort profile synchronously (friend record, cached CF lookup,
   or a bare {userId} stub), and kicks off a CF fetch in the background to fill
   the cache and re-render if we didn't already have real data for this uid. */
function getProfileSync(uid){
  const f = state.friends.find(x=>x.userId===uid);
  if(f) return f;
  const cached = state.profileCache[uid];
  if(cached) return cached;
  BubbleCF.getProfile(uid).then(p=>{
    if(p){
      state.profileCache[uid] = p;
      if(state.screenStack.some(s=>s.id===uid) || state.activeConvoId===uid) renderAll();
    }
  }).catch(err=> console.warn('[CF] getProfile failed', err));
  return {userId:uid, nickname:uid, avatarEmoji:'🙂'};
}

/* ================= display name helper (req 3) ================= */
/* A 1:1 chat needs its OWN room, distinct from either person's personal
   mailbox room. The mailbox (named after your own userId) is joined by
   EVERY friend who has a convo with you — reusing it for actual chat
   content means anyone else who's added you as a friend sits in that same
   room and the relay (which broadcasts to everyone but the sender) leaks
   your messages to them, or drops them if they're not both online in the
   same place. This gives every pair their own dedicated, deterministic
   room that only the two of them ever join. */
function dmRoomId(a, b){ return 'dm_' + [a,b].sort().join('_'); }

/* The room name to actually join/send on for a given convo — group convos
   already have a globally-shared unique id, so use it as-is; 1:1 convos
   need the dedicated pair room above, never convo.id itself (which is just
   the friend's own userId, and per the note above, joining that directly is
   the bug). */
function wireRoomFor(convo){
  return convo.type==='group' ? convo.id : dmRoomId(state.me.userId, convo.id);
}

/* A one-shot fire-and-forget publish that fails silently (network hiccup,
   Worker cold start, etc.) means that account is NEVER discoverable by exact
   UserID until they happen to log in again — there was no retry anywhere.
   This retries a few times with backoff, and only surfaces a toast if every
   attempt fails, so the person knows their profile might not be searchable
   yet rather than silently assuming it worked. */
async function publishProfileWithRetry(acc, attempts=3){
  for(let i=0;i<attempts;i++){
    try{ await BubbleCF.publishProfile(acc); return; }
    catch(err){
      console.warn(`[CF] publishProfile attempt ${i+1}/${attempts} failed`, err);
      if(i < attempts-1) await new Promise(r=> setTimeout(r, 800*(i+1)));
    }
  }
  showToast(currentLang==='zh' ? '资料同步失败，其他人暂时搜不到你，请检查网络' : "Profile sync failed — you won't be searchable until this succeeds");
}

function displayNameForUser(userId, fallbackName){
  const f = state.friends.find(x => x.userId === userId);
  if(f) return f.remark || f.nickname || fallbackName || userId;
  return fallbackName || userId;
}
function displayNameForConvo(c){
  if(!c) return '';
  if(c.type === 'single') return displayNameForUser(c.id, c.name);
  return c.name;
}

/* ================= bootstrap / auth ================= */
async function bootstrap(){
  await BubbleDB.purgeExpiredMessages();
  document.documentElement.setAttribute('data-theme', await BubbleDB.getSetting('theme', 'dark'));
  currentLang = await BubbleDB.getSetting('lang', 'zh');

  authAccounts = await BubbleDB.listAccounts();
  const activeId = await BubbleDB.getActiveUserId();
  const sessionOk = await BubbleDB.getSetting('sessionUnlocked', false);

  if(activeId && sessionOk){
    const acc = await BubbleDB.getAccountById(activeId);
    if(acc){
      await enterApp(acc);
      return;
    }
  }
  showAuthOverlay();
}

async function enterApp(acc){
  state.me = acc;
  state.authed = true;
  await BubbleDB.setActiveUserId(acc.userId);
  await BubbleDB.setSetting('sessionUnlocked', true);
  BubbleComm.init(state.me.userId);
  state.friends = await BubbleDB.listFriends();
  state.convos = await loadConvos();
  // sync single-chat display names with remarks
  for(const c of state.convos){
    if(c.type === 'single'){
      const dn = displayNameForUser(c.id, c.name);
      if(c.name !== dn){ c.name = dn; await BubbleDB.upsertConvo(c); }
    }
  }
  BubbleComm.onMessage(handleIncoming);
  // Personal "mailbox" room, keyed by my own userId — this is how other users'
  // clients reach me for things I haven't accepted/joined yet (friend adds via
  // search, group invites) even before I have a conversation with them.
  BubbleComm.joinRoom(state.me.userId);
  state.convos.forEach(c => BubbleComm.joinRoom(wireRoomFor(c)));
  hideAuthOverlay();
  renderShell();
  // Best-effort: keep my nickname/avatar/public key discoverable by others.
  // Never blocks login if the network/Worker is unreachable.
  publishProfileWithRetry(state.me);
  // Anything sent to me while I was offline (invites, messages to a peer/group
  // I wasn't connected to at the time) sits queued server-side — pull it now.
  pullOfflineQueue();
  setupResyncOnReturn();
  // Safety net: a brand-new friend's very first message can arrive before I've
  // ever joined the dm room with them (I only learn that room exists once
  // their friend_add/chat has been processed at least once), and a mobile
  // browser can silently drop the WebSocket while backgrounded without firing
  // a 'close' event (so comm.js's own reconnect never triggers). Polling the
  // offline queue on an interval — on top of live delivery and the
  // resync-on-return below — means "sent but not yet delivered" is capped at
  // this interval instead of "until something else happens to reconnect me".
  if(offlinePollIntervalId) clearInterval(offlinePollIntervalId);
  offlinePollIntervalId = setInterval(()=>{ if(state.authed) pullOfflineQueue(); }, 15000);
}

let resyncListenersAttached = false;
function setupResyncOnReturn(){
  if(resyncListenersAttached) return;
  resyncListenersAttached = true;
  const resync = ()=>{
    if(!state.authed || document.visibilityState==='hidden') return;
    BubbleComm.joinRoom(state.me.userId);
    state.convos.forEach(c => BubbleComm.joinRoom(wireRoomFor(c)));
    pullOfflineQueue();
  };
  document.addEventListener('visibilitychange', resync);
  window.addEventListener('focus', resync);
  window.addEventListener('online', resync);
}

/* SignalRoom is a pure live relay with no history (see signalRoom.js) — the
   only way something sent while I was offline reaches me is this queue.
   Deliver-once: the server deletes each item as soon as it hands it back. */
async function pullOfflineQueue(){
  let items = [];
  try{ items = await BubbleCF.pullOffline(state.me.userId); }
  catch(err){ console.warn('[CF] offline pull failed', err); return; }
  for(const item of items){
    const payload = item.envelope;
    if(!payload || !payload.kind) continue;
    // Everything in this queue was addressed to me — invite/friend_add check
    // roomId===state.me.userId (their own-mailbox convention), which holds
    // here by construction; chat messages resolve via payload.isGroup/from
    // and don't use roomId at all. See handleIncoming.
    await handleIncoming(state.me.userId, payload);
  }
}

}

async function doRegister(){
  const nickname = document.getElementById('reg-nickname').value.trim();
  const password = document.getElementById('reg-password').value;
  const password2 = document.getElementById('reg-password2').value;
  const avatarEmoji = document.getElementById('reg-avatar-value').value || '🐱';
  const err = document.getElementById('auth-error');
  if(!nickname){ err.textContent = t('nickname_required'); return; }
  if(!password){ err.textContent = t('password_required'); return; }
  if(password.length < 6){ err.textContent = t('password_too_short'); return; }
  if(password !== password2){ err.textContent = t('password_mismatch'); return; }

  // The numeric UserID has to come from the server-side allocator (see
  // IdAllocator in the Worker) — it's the only thing that guarantees two
  // people registering at the same instant never get the same number.
  // Unlike profile publishing this is NOT best-effort: without a real,
  // unique ID there's nothing safe to register locally, so we block and
  // show a clear retry-able error instead of falling back to something
  // locally-generated.
  const regBtn = document.getElementById('reg-submit');
  if(regBtn) regBtn.disabled = true;
  err.textContent = t('allocating_id');
  let userId;
  try{ userId = await BubbleCF.allocateUserId(); }
  catch(e){
    console.warn('[CF] allocate-id failed', e);
    err.textContent = t('allocate_id_failed');
    if(regBtn) regBtn.disabled = false;
    return;
  }

  const { privateKey, publicKeyB64 } = await BubbleCrypto.generateIdentityKeyPair();
  const { hashB64, saltB64 } = await BubbleCrypto.hashPassword(password);
  const acc = {
    userId,
    nickname,
    avatarEmoji,
    color: colorFromString(nickname),
    privateKey,
    publicKeyB64,
    passwordHash: hashB64,
    passwordSalt: saltB64,
    createdAt: Date.now()
  };
  await BubbleDB.saveAccount(acc);
  authAccounts = await BubbleDB.listAccounts();
  authSelectedUserId = acc.userId;
  authMode = 'login';
  renderAuth();
  const err2 = document.getElementById('auth-error');
  if(err2) err2.textContent = t('register_ok');
  // Publish nickname/avatar/publicKey to CF so this account becomes searchable
  // by other users right away. Best-effort — registration itself must not fail
  // if the network/Worker is unreachable, the account still exists locally
  // and enterApp() will retry the sync on next login.
  publishProfileWithRetry(acc);
}

async function doLogin(){
  const password = document.getElementById('login-password')?.value || '';
  const err = document.getElementById('auth-error');
  if(!password){ err.textContent = t('password_required'); return; }
  const uid = authSelectedUserId || (authAccounts[0] && authAccounts[0].userId);
  if(!uid){ err.textContent = t('login_failed'); return; }
  const acc = await BubbleDB.getAccountById(uid);
  if(!acc){ err.textContent = t('login_failed'); return; }
  const ok = await BubbleCrypto.verifyPassword(password, acc.passwordSalt, acc.passwordHash);
  if(!ok){ err.textContent = t('login_failed'); return; }
  await enterApp(acc);
}

window.addEventListener('resize', layoutForViewport);
function isMobile(){ return window.innerWidth <= 900; }
function layoutForViewport(){
  const listPanel = document.getElementById('list-panel');
  const mainPanel = document.getElementById('main-panel');
  const contentPanel = document.querySelector('.content-panel');
  const tabbar = document.querySelector('.tabbar');
  if(!listPanel) return;
  const hasScreen = state.screenStack.length>0;
  const hasChat = !!state.activeConvoId;
  if(isMobile()){
    listPanel.style.display = (hasScreen||hasChat) ? 'none' : 'flex';
    contentPanel.style.display = (hasScreen||hasChat) ? 'flex' : 'none';
    tabbar.style.display = (hasScreen||hasChat) ? 'none' : 'flex';
    mainPanel.classList.toggle('open', hasChat && !hasScreen);
  } else {
    listPanel.style.display='flex';
    contentPanel.style.display='flex';
    tabbar.style.display='none';
    mainPanel.classList.add('open');
  }
}

async function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');

  document.documentElement.setAttribute('data-theme', next);
  await BubbleDB.setSetting('theme', next);
  document.getElementById('theme-toggle').innerHTML = icon(next==='dark'?'moon':'sun');
}

function renderTabStates(){
  ['chats','contacts','add','me'].forEach(name=>{
    const active = state.activeTab===name && state.screenStack.length===0;
    document.getElementById('rail-'+name)?.classList.toggle('active', active);
    document.getElementById('tab-'+name)?.classList.toggle('active', active);
  });
  const unreadChats = state.convos.reduce((s,c)=>s+(c.unread||0),0);

function contactsBodyHtml(query){
  const q = (query||'').trim().toLowerCase();
  if(q){
    const friendsMatched = state.friends.filter(f=> (f.remark||'').toLowerCase().includes(q) || f.nickname.toLowerCase().includes(q));
    const groupsMatched = state.convos.filter(c=>c.type==='group' && c.name.toLowerCase().includes(q));
    if(!friendsMatched.length && !groupsMatched.length) return emptyHint();
    let html = '';
    if(groupsMatched.length){
      html += `<div class="section-label">${t('my_groups')}</div>`;
      html += groupsMatched.map(g=>`<div class="contact-row" data-group="${g.id}"><div class="avatar-wrap">${avatarHtml(g,'small')}<span class="avatar-group-badge sm">${t('group_badge')}</span></div><div class="conv-mid"><span class="conv-name">${escapeHtml(g.name)}</span></div></div>`).join('');
    }
    if(friendsMatched.length){
      html += `<div class="section-label">${t('tab_contacts')}</div>`;
      html += friendsMatched.map(friendRowHtml).join('');
    }
    return html;
  }
  const groups = [...state.convos.filter(c=>c.type==='group')].sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || a.name.localeCompare(b.name,'zh-Hans-CN'));
  const groupsHtml = groups.length
    ? groups.map(g=>`<div class="contact-row group-sub" data-group="${g.id}"><div class="avatar-wrap">${avatarHtml(g,'small')}<span class="avatar-group-badge sm">${t('group_badge')}</span></div><div class="conv-mid"><span class="conv-name">${escapeHtml(g.name)}${g.pinned?` <span class="pill">${t('pinned')}</span>`:''}</span></div></div>`).join('')
    : `<div class="contact-row group-sub" style="color:var(--text-faint);font-size:12.5px;cursor:default;">${t('no_group_convos')}</div>`;
  const groupsSection = `
    <div class="contact-row" id="row-my-groups">
      <div class="func-icon" style="background:linear-gradient(135deg,#4C86E0,#3A5FBF)">${icon('group')}</div>
      <div class="conv-mid"><span class="conv-name">${t('my_groups')}</span></div>
      <span class="arrow" style="transform:rotate(${state.contactsGroupsExpanded?90:0}deg);transition:transform .15s;">${icon('chevronRight')}</span>
    </div>
    ${state.contactsGroupsExpanded ? `<div class="group-sublist">${groupsHtml}<div class="contact-row group-sub start-group-row" id="row-start-group">
        <div class="func-icon" style="background:linear-gradient(135deg,var(--accent-gold-soft),var(--accent-gold));color:#171717;">${icon('plus')}</div>
        <div class="conv-mid"><span class="conv-name">${t('new_group')}</span></div>
      </div></div>` : ''}`;
  const pinnedFriends = state.friends.filter(f=>f.pinned);
  const others = state.friends.filter(f=>!f.pinned);
  const byLetter = {};
  others.forEach(f=>{
    const ini = (f.remark||f.nickname||'#')[0].toUpperCase();
    (byLetter[ini]=byLetter[ini]||[]).push(f);
  });
  const letters = Object.keys(byLetter).sort();
  let friendsHtml = '';
  if(pinnedFriends.length){
    friendsHtml += `<div class="section-label">★ ${t('pinned')}</div>` + pinnedFriends.map(friendRowHtml).join('');
  }
  letters.forEach(l=>{ friendsHtml += `<div class="section-label">${l}</div>` + byLetter[l].map(friendRowHtml).join(''); });
  return `<div class="contact-row" id="row-new-friends">
      <div class="func-icon" style="background:linear-gradient(135deg,#F5A85B,#E4744C)">${icon('users')}</div>
      <div class="conv-mid"><span class="conv-name">${t('new_friends')}</span></div>
    </div>
    ${groupsSection}
    ${friendsHtml}`;
}
function friendRowHtml(f){
  const convo = state.convos.find(c=>c.id===f.userId);
  const unread = convo && convo.unread ? `<span class="badge" style="position:static;">${convo.unread}</span>` : '';
  return `<div class="contact-row" data-friend="${f.userId}">${avatarHtml(f,'small')}<div class="conv-mid"><span class="conv-name">${escapeHtml(f.remark||f.nickname)}${f.pinned?` <span class="pill">${t('pinned')}</span>`:''}</span></div>${unread}</div>`;

function wireList(){
  document.querySelectorAll('[data-convo]').forEach(row=>{
    let sx=0;
    row.addEventListener('click', (e)=>{ if(e.target.closest('.swipe-actions')) return; openConvo(row.dataset.convo); });
    row.addEventListener('touchstart', e=> sx = e.touches[0].clientX);
    row.addEventListener('touchend', e=>{
      const dx = e.changedTouches[0].clientX - sx;
      document.querySelectorAll('.conv-item.swiped').forEach(x=>{ if(x!==row) x.classList.remove('swiped'); });
      if(dx<-40) row.classList.add('swiped'); else if(dx>20) row.classList.remove('swiped');
    });
  });
  document.querySelectorAll('[data-pin]').forEach(b=> b.onclick = (e)=>{ e.stopPropagation(); pinConvo(b.dataset.pin); });
  document.querySelectorAll('[data-del]').forEach(b=> b.onclick = (e)=>{ e.stopPropagation(); deleteConvoConfirm(b.dataset.del); });
  document.getElementById('btn-plus-chats')?.addEventListener('click', openCreateSheet);
  document.getElementById('btn-plus-contacts')?.addEventListener('click', openCreateSheet);
  document.querySelectorAll('[data-friend]').forEach(row=> row.onclick = ()=> pushScreen({type:'friendInfo', id: row.dataset.friend}));
  document.querySelectorAll('[data-group]').forEach(row=> row.onclick = ()=> openConvo(row.dataset.group));
  document.getElementById('row-new-friends')?.addEventListener('click', ()=> pushScreen({type:'addFriend'}));
  document.getElementById('row-my-groups')?.addEventListener('click', ()=>{
    state.contactsGroupsExpanded = !state.contactsGroupsExpanded;
    document.getElementById('contacts-body').innerHTML = contactsBodyHtml('');
    wireList();
  });
  document.getElementById('row-start-group')?.addEventListener('click', (e)=>{ e.stopPropagation(); pushScreen({type:'newGroup'}); });
  document.querySelectorAll('[data-add-item]').forEach(row=> row.onclick = ()=> window.__addItems[row.dataset.addItem].action());
  document.getElementById('row-my-qrcode')?.addEventListener('click', ()=> pushScreen({type:'qrcode'}));
  document.getElementById('row-scan')?.addEventListener('click', ()=> openScan('addFriend'));
  document.getElementById('row-settings')?.addEventListener('click', ()=> pushScreen({type:'settings'}));
  document.getElementById('me-uid-copy')?.addEventListener('click', async (e)=>{
    e.stopPropagation();
    try{
      await navigator.clipboard.writeText(state.me.userId);
      const btn = document.getElementById('me-uid-copy');
      if(btn){ btn.classList.add('copied'); setTimeout(()=>btn.classList.remove('copied'), 1200); }
    }catch(_){}
  });
  document.getElementById('me-avatar-edit')?.addEventListener('click', openEditAvatar);
  document.getElementById('me-nickname-edit')?.addEventListener('click', openEditNickname);
  document.getElementById('search-cancel')?.addEventListener('click', ()=>{ state.searchMode=false; renderList(); });
  document.getElementById('chat-search')?.addEventListener('input', onChatSearchInput);
  document.getElementById('contacts-search')?.addEventListener('input', (e)=>{
    document.getElementById('contacts-body').innerHTML = contactsBodyHtml(e.target.value);
    wireList();
  });
}

async function onChatSearchInput(e){
  const q = e.target.value.trim().toLowerCase();
  const el = document.getElementById('chat-list');
  if(!el) return;
  if(!q){ el.innerHTML = sortedConvos().map(convoRowHtml).join('') || emptyHint(); wireList(); return; }
  const matched = [];
  for(const c of sortedConvos()){
    const name = displayNameForConvo(c).toLowerCase();
    if(name.includes(q) || c.name.toLowerCase().includes(q)){ matched.push(c); continue; }
    const msgs = await BubbleDB.listMessages(c.id);
    if(msgs.some(m=> m.type==='text' && String(m.content).toLowerCase().includes(q))) matched.push(c);
  }
  el.innerHTML = matched.map(convoRowHtml).join('') || emptyHint();
  wireList();
}

function avatarHtml(entity, size){
  const cls = size ? `avatar ${size}` : 'avatar';
  const color = entity.color || colorFromString(entity.nickname||entity.name||entity.userId||'?');
  return `<div class="${cls}" style="background:${color}">${entity.avatarEmoji||'🙂'}</div>`;
}
function colorFromString(s){
  const palette = ['#D98A8A','#5B7FDB','#E39FC2','#37C9B9','#E0B84A','#8C7AE6','#4C86E0','#E4744C'];
  let h=0; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i))>>>0;
  return palette[h%palette.length];
}
function relTime(ts){
  if(!ts) return '';
  const m = Math.round((Date.now()-ts)/60000);
  if(m<1) return currentLang==='zh'?'刚刚':'now';
  if(m<60) return currentLang==='zh'?`${m}分钟前`:`${m}m`;
  const h = Math.round(m/60);
  if(h<24) return currentLang==='zh'?`${h}小时前`:`${h}h`;
  return currentLang==='zh'?`${Math.round(h/24)}天前`:`${Math.round(h/24)}d`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function pinConvo(id){
  const c = state.convos.find(c=>c.id===id);
  if(!c) return;
  c.pinned = !c.pinned;
  await BubbleDB.upsertConvo(c);
  renderList();
}
/* req 2: delete convo clears messages; for groups also leave */
function deleteConvoConfirm(id){
  const c = state.convos.find(x=>x.id===id);
  const isGroup = c && c.type==='group';
  showModal({
    title: isGroup ? t('delete_group') : (currentLang==='zh'?'删除会话':'Delete chat'),
    body: isGroup ? t('dissolve_confirm') : (currentLang==='zh'?'删除后聊天记录将从本机清除。':'This will remove the chat history from this device.'),
    onConfirm: async ()=>{
      BubbleComm.leaveRoom(c ? wireRoomFor(c) : id);
      await BubbleDB.deleteConvo(id);
      state.convos = state.convos.filter(c=>c.id!==id);
      if(state.activeConvoId===id) state.activeConvoId=null;
      renderAll();
    }
  });
}
async function openOrCreateConvoWithFriend(friendId){
  let convo = state.convos.find(c=>c.id===friendId);
  if(!convo){
    const f = state.friends.find(f=>f.userId===friendId);
    const name = f ? (f.remark || f.nickname) : friendId;
    convo = {id:friendId, type:'single', name, avatarEmoji:f?.avatarEmoji||'🙂', color:f?.color, updatedAt:Date.now()};
    await BubbleDB.upsertConvo(convo);
    state.convos.unshift(convo);
  } else {
    // keep name in sync with remark
    const dn = displayNameForUser(friendId, convo.name);
    if(convo.name !== dn){ convo.name = dn; await BubbleDB.upsertConvo(convo); }
  }
  state.activeTab='chats';
  openConvo(friendId);
}

const TTL_OPTIONS = [
  [24, ()=> currentLang==='zh'?'24小时':'24h'],
  [72, ()=> currentLang==='zh'?'3天':'3d'],
  [168, ()=> currentLang==='zh'?'7天':'7d'],
  [720, ()=> currentLang==='zh'?'30天':'30d'],
  [0, ()=> t('forever')],
];
function formatTtlLabel(ephemeral, ttlMs){
  if(!ephemeral) return t('forever');
  const h = Math.round(ttlMs/3600000);
  const found = TTL_OPTIONS.find(([hh])=>hh===h);
  return found ? found[1]() : (currentLang==='zh'?`${h}小时`:`${h}h`);
}
function promptTtlPicker(currentHours, onConfirm){
  const overlay = document.getElementById('modal-overlay');

          <span>${label()}</span>${h===currentHours?icon('check'):''}
        </div>`).join('')}
      </div>
      <div class="modal-actions"><button class="btn-cancel" id="modal-cancel" style="flex:1;">${t('cancel')}</button></div>

}

/* Network search against the CF Worker's user directory — fires only on an
   explicit tap/Enter, never per-keystroke (each search is a real network
   round trip; typing "101037" one digit at a time used to fire ~6 of
   them). Renders loading / empty / error states so "typed something,
   nothing happened" never looks broken. */
let afSearchSeq = 0;
function runFriendSearch(q){
  const results = document.getElementById('af-results');
  if(!results) return;
  if(!q){ results.innerHTML = ''; return; }
  results.innerHTML = `<div class="auth-empty">${currentLang==='zh'?'搜索中…':'Searching…'}</div>`;
  const seq = ++afSearchSeq;
  (async ()=>{
    let hits = [];
    try{ hits = await BubbleCF.searchUsers(q); }
    catch(err){
      if(seq!==afSearchSeq) return;
      console.warn('[CF] search failed', err);
      results.innerHTML = `<div class="auth-empty">${currentLang==='zh'?'搜索失败，请检查网络':'Search failed — check your connection'}</div>
        <div class="pill-btn view" id="af-retry" style="text-align:center;margin-top:8px;">${currentLang==='zh'?'重试':'Retry'}</div>`;
      document.getElementById('af-retry')?.addEventListener('click', ()=> runFriendSearch(q));
      return;
    }
    if(seq!==afSearchSeq) return; // a newer search already superseded this one
    const already = new Set(state.friends.map(f=>f.userId));
    hits = hits.filter(u=> u.userId!==state.me.userId && !already.has(u.userId));
    results.innerHTML = hits.length
      ? hits.map(u=>friendResultRow(u)).join('')
      : `<div class="auth-empty">${currentLang==='zh'?'未找到该用户':'No matching user'}</div>`;
    wireFriendResultRows();
  })();
}
function wireFriendResultRows(){
  document.querySelectorAll('[data-add]').forEach(b=> b.onclick = async (ev)=>{
    ev.stopPropagation();
    const row = b.closest('[data-uid]');
    const u = row ? JSON.parse(row.dataset.profile) : null;
    if(!u) return;
    await addFriendAndRefresh(u);
    b.textContent = t('added'); b.classList.remove('view'); b.classList.add('done'); b.disabled = true;
  });
  // Tapping the avatar/name (not the Add button) opens the profile view.
  document.querySelectorAll('[data-view-profile]').forEach(el=> el.onclick = ()=>{
    const row = el.closest('[data-uid]');
    const u = row ? JSON.parse(row.dataset.profile) : null;
    if(!u) return;
    state.profileCache[u.userId] = u;
    pushScreen({type:'friendInfo', id:u.userId});
  });
}

function screenQrCode(){
  const payload = JSON.stringify({t:'friend', uid:state.me.userId, nickname:state.me.nickname, avatarEmoji:state.me.avatarEmoji, publicKeyB64:state.me.publicKeyB64});
  let svg = '';
  try{
    const qr = qrcode(0, 'M');
    // qrcode-generator's byte mode reads each JS string char via charCodeAt(),
    // which is fine for ASCII but mangles any multi-byte UTF-8 character
    // (emoji avatar, non-Latin nicknames) into garbage on the decode side.
    // encodeURIComponent+unescape re-packs the string as its raw UTF-8 byte
    // sequence (one JS char per byte), which is the standard workaround for
    // this library — jsQR already decodes byte-mode QR data as UTF-8, so no
    // change is needed on the scanning/decoding side.
    qr.addData(unescape(encodeURIComponent(payload)));
    qr.make();
    svg = qr.createSvgTag({scalable:true});
  }catch(e){ svg = ''; }
  return screenHeader(t('my_qrcode')) + `
    <div class="screen-body" style="display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:30px;">
      ${avatarHtml(state.me,'large')}
      <div style="font-size:16px;font-weight:700;">${escapeHtml(state.me.nickname)}</div>
      <div class="qr-frame">${svg}</div>

    </div>`;
}

function wireScreen(top){
  document.getElementById('btn-back')?.addEventListener('click', popScreen);
  if(top.type==='addFriend'){
    const input = document.getElementById('af-search');
    document.getElementById('af-search-btn')?.addEventListener('click', ()=> runFriendSearch(input.value.trim()));
    input?.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); runFriendSearch(input.value.trim()); } });
    document.getElementById('af-scan-row')?.addEventListener('click', ()=>{ state.screenStack.pop(); pushScreen({type:'scan', purpose:'addFriend'}); });
  }
  if(top.type==='scan'){
    document.getElementById('scan-fallback-link')?.addEventListener('click', (e)=>{
      e.preventDefault();
      const ta = document.getElementById('scan-fallback-text');
      ta.style.display = ta.style.display==='none' ? 'block' : 'none';
      ta.onkeydown = (ev)=>{ if(ev.key==='Enter'){ ev.preventDefault(); handleScannedPayload(ta.value.trim()); } };
    });
  }
  if(top.type==='newGroup'){
    const picked = new Set();
    let ngAvatarEmoji = '💬';
    let ngTtlHours = 24;
    document.querySelectorAll('[data-pick]').forEach(row=> row.onclick = ()=>{
      const uid = row.dataset.pick;
      picked.has(uid) ? picked.delete(uid) : picked.add(uid);
      row.querySelector('.checkbox').classList.toggle('checked');
      document.getElementById('ng-create').disabled = picked.size===0 || !document.getElementById('ng-name').value.trim();
    });
    document.getElementById('ng-avatar-edit')?.addEventListener('click', ()=>{
      promptAvatarPicker((emoji)=>{
        ngAvatarEmoji = emoji;
        document.getElementById('ng-avatar-edit').innerHTML = avatarHtml({avatarEmoji:emoji, color:'#37C9B9'}, 'small');
      });
    });
    document.getElementById('row-ng-ttl')?.addEventListener('click', ()=>{
      promptTtlPicker(ngTtlHours, (h)=>{
        ngTtlHours = h;
        document.getElementById('ng-ttl-label').innerHTML = `${TTL_OPTIONS.find(([hh])=>hh===h)[1]()}<span class="arrow">${icon('chevronRight')}</span>`;
      });
    });
    document.getElementById('ng-name')?.addEventListener('input', (e)=>{
      document.getElementById('ng-create').disabled = picked.size===0 || !e.target.value.trim();
    });
    document.getElementById('ng-create')?.addEventListener('click', async ()=>{
      const name = document.getElementById('ng-name').value.trim();
      const ephemeral = ngTtlHours>0;
      const { rawB64: groupKeyB64 } = await BubbleCrypto.generateGroupKey();
      const room = {id:'room_'+crypto.randomUUID().slice(0,6), type:'group', name, avatarEmoji:ngAvatarEmoji, color:'#37C9B9',
        ephemeral, ttlMs: ephemeral?ngTtlHours*3600000:null, owner: state.me.userId, createdAt: Date.now(),
        members:Array.from(picked), updatedAt:Date.now(), groupKeyB64};
      await BubbleDB.upsertConvo(room);
      state.convos.unshift(room);
      state.screenStack = [];
      openConvo(room.id);
      inviteMembersToGroup(room, Array.from(picked));
    });
  }
  if(top.type==='settings'){
    document.getElementById('st-theme-toggle')?.addEventListener('click', async ()=>{ await toggleTheme(); pushScreen(state.screenStack.pop()); });
    document.getElementById('st-lang-zh')?.addEventListener('click', ()=>{ if(currentLang!=='zh') setLanguage('zh'); });
    document.getElementById('st-lang-en')?.addEventListener('click', ()=>{ if(currentLang!=='en') setLanguage('en'); });
    document.getElementById('row-change-password')?.addEventListener('click', ()=> pushScreen({type:'changePassword'}));

  if(top.type==='inviteMembers'){
    const g = state.convos.find(c=>c.id===top.id);
    const picked = new Set();
    document.querySelectorAll('[data-pick]').forEach(row=> row.onclick = ()=>{

          if(state.activeConvoId===top.id) state.activeConvoId=null;

        }
      });

async function addFriendAndRefresh(u){
  if(!u) return;
  if(state.friends.find(f=>f.userId===u.userId)) return;
  const friend = { ...u, addedAt: u.addedAt || Date.now(), remark: u.remark || '' };
  await BubbleDB.upsertFriend(friend);
  state.friends.push(friend);
  notifyFriendAdd(friend);
}

/* Tell the other person I added them, so their client reciprocally adds me
   back and creates a chat shell — without this, adding someone was a purely
   local action they'd never learn about, and any message I later sent had
   nowhere to land on their side (see handleIncoming's 'chat' fallback below).
   Encrypted pairwise — I already have their public key (that's literally how
   I just added them), so there's no chicken-and-egg problem here. */
async function notifyFriendAdd(friend){
  const info = { nickname: state.me.nickname, avatarEmoji: state.me.avatarEmoji, color: state.me.color, publicKeyB64: state.me.publicKeyB64 };
  const envelope = await encryptForPeer(friend.userId, info);
  if(!envelope){ console.warn('[crypto] cannot notify friend_add — no public key for', friend.userId); return; }
  const payload = {kind:'friend_add_env', from: state.me.userId, envelope};
  BubbleComm.send(friend.userId, payload);        // live, in case they're online right now
  setTimeout(()=> BubbleComm.leaveRoom(friend.userId), 3000);
  BubbleCF.pushOffline(friend.userId, state.me.userId, payload)  // durable fallback
    .catch(err=> console.warn('[CF] friend_add push failed', err));
}

/* ================= SCAN ================= */
async function startScan(purpose){
  const video = document.getElementById('scan-video');
  if(!video) return;
  try{
    // Ideal (not exact) constraints: most phone cameras default to a much
    // higher resolution than this when unconstrained, and running
    // getImageData()+jsQR() on a full 4K frame every animation frame is slow
    // enough that only a handful of (often motion-blurred) frames actually
    // get scanned per second — that's the usual cause of a high miss rate
    // despite the code being "correct". Capping the requested resolution
    // fixes it at the source; downscaling the canvas below is the second
    // half of the same fix for cameras that ignore the constraint.
    scanStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'environment', width:{ideal:1280}, height:{ideal:720} }
    });
    video.srcObject = scanStream;
    await video.play();
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    const MAX_DIM = 720; // cap the frame jsQR actually processes
    const tick = ()=>{
      if(!video.videoWidth){ scanRafId = requestAnimationFrame(tick); return; }
      const scale = Math.min(1, MAX_DIM / Math.max(video.videoWidth, video.videoHeight));
      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const result = window.jsQR ? jsQR(imgData.data, imgData.width, imgData.height, {inversionAttempts:'attemptBoth'}) : null;
      if(result && result.data){ handleScannedPayload(result.data); return; }
      scanRafId = requestAnimationFrame(tick);
    };
    scanRafId = requestAnimationFrame(tick);
  }catch(e){
    document.querySelector('.scan-video-wrap').innerHTML = `<div style="color:#fff;padding:24px;text-align:center;">${t('camera_denied')}</div>`;
  }
}
function stopScan(){
  if(scanRafId) cancelAnimationFrame(scanRafId); scanRafId=null;
  if(scanStream){ scanStream.getTracks().forEach(tr=>tr.stop()); scanStream=null; }
}
function openScan(purpose){ pushScreen({type:'scan', purpose}); }

async function handleScannedPayload(text){
  let payload;
  try{ payload = JSON.parse(text); }
  catch(e){
    console.warn('[scan] not JSON, ignoring frame:', text);
    showToast(currentLang==='zh' ? '未识别到有效二维码，请对准泡泡IM生成的码' : 'Not a recognized code — point at a BubbleIM-generated QR');
    // keep scanning — a stray non-JSON QR in frame (e.g. an ad poster) shouldn't kill the session
    return;
  }
  stopScan();
  if(payload.t==='friend' && payload.uid){
    if(payload.uid === state.me.userId){
      showToast(currentLang==='zh' ? '这是你自己的二维码' : "That's your own QR code");
      state.screenStack.pop(); renderAll();
      return;
    }
    showModal({ title:t('add_confirm'), body:escapeHtml(payload.nickname||payload.uid), onConfirm: async ()=>{
      await addFriendAndRefresh({userId:payload.uid, nickname:payload.nickname||payload.uid, avatarEmoji:payload.avatarEmoji||'🙂', publicKeyB64:payload.publicKeyB64});
      state.screenStack = [];
      renderAll();
    }});
  } else if(payload.t==='group' && payload.gid){
    // NOTE: nothing in this app currently generates a group-type QR code
    // (screenQrCode only ever encodes a friend-add payload), so this branch
    // is presently unreachable. If a group QR generator gets added later,
    // it MUST also include groupKeyB64 (see inviteMembersToGroup) or the
    // joining device will have a group it can never decrypt any messages in.
    showModal({ title:t('join_group'), body:escapeHtml(payload.name||payload.gid), onConfirm: async ()=>{
      const room = {id:payload.gid, type:'group', name:payload.name||payload.gid, avatarEmoji:'💬', color:'#37C9B9',
        ephemeral:true, ttlMs:24*60*60*1000, members:[], owner: payload.ownerId || null, createdAt: payload.createdAt || Date.now(), updatedAt:Date.now(),
        groupKeyB64: payload.groupKeyB64 || null};
      await BubbleDB.upsertConvo(room);
      state.convos.unshift(room);
      BubbleComm.joinRoom(room.id);
      state.screenStack = [];
      openConvo(room.id);
    }});
  } else {
    showToast(currentLang==='zh' ? '二维码格式不支持' : 'Unsupported QR code format');
    state.screenStack.pop(); renderAll();
  }
}

    if(c.unread){ c.unread = 0; await BubbleDB.upsertConvo(c); }

  state.screenStack = [];
  renderAll();
}

    hold.addEventListener('touchmove', (e)=>{
      const y = e.touches[0].clientY;
      const overlay = document.getElementById('record-overlay');
