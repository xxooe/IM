   ==================  语音/视频通话模块 结束  ======================
   ================================================================ */


async function sendMessage(type, content){
  const convo = state.convos.find(c=>c.id===state.activeConvoId);
  if(!convo) return;
  if(type==='text' && !content) return;

  const msg = { msgId:'m_'+crypto.randomUUID(), convId:convo.id, from:state.me.userId, type, content,
    createdAt:Date.now(), expiresAt: convo.ephemeral ? Date.now()+(convo.ttlMs||86400000) : null,
    delivered:false }; // 乐观先存本地，delivered标记由 deliverMessage 异步回填——不再依赖服务端持久化
  await BubbleDB.addMessage(msg);
  convo.updatedAt = Date.now();
  convo.lastPreview = previewFor(msg);
  await BubbleDB.upsertConvo(convo);

  // isGroup + convId（只有群聊场景才有意义——双方都已经知道的共享房间id）
  // 是接收方用来判断"这条消息属于本地哪个会话"的依据。1:1场景下，wire
  // room是双方共用的dm房间，双方各自的convo.id都对不上，所以接收方改用
  // `from`字段来判断——见handleIncoming。type/content才是真正的消息正文，
  // 那部分放在加密信封里面，绝不会出现在外层payload里。
  const isGroup = convo.type==='group';
  let envelope;
  if(isGroup){
    if(!convo.groupKeyB64){ showToast(currentLang==='zh'?'群密钥缺失，无法发送':'Missing group key — cannot send'); return; }
    const key = await BubbleCrypto.importGroupKey(convo.groupKeyB64);
    envelope = await BubbleCrypto.encryptText(key, JSON.stringify({type, content}));
  } else {
    envelope = await encryptForPeer(convo.id, {type, content});
    if(!envelope){ showToast(currentLang==='zh'?'对方公钥暂时获取不到，稍后重试':"Can't reach their public key yet — try again shortly"); return; }
  }
  const payload = {kind:'chat', isGroup, convId: isGroup?convo.id:null, msgId:msg.msgId, from:msg.from, createdAt:msg.createdAt, expiresAt:msg.expiresAt, envelope};
  deliverMessage(convo, payload); // 不等它——发送/降级判定放后台跑，不卡输入框清空这个操作的观感

  const ta = document.getElementById('msgInput');
  if(ta){ ta.value=''; document.getElementById('sendBtn').disabled = true; }
  document.getElementById('emojiPanel')?.classList.remove('open');
  await renderMain();
  window.AdManager?.showMessageAdIfDue(); // 顶部滑入小广告——跟发消息这个动作挂钩，具体多久出现一次由ads.js里的频率配置决定
}

/* 真正决定"这条消息走P2P还是CF"的地方——从 sendMessage 拆出来是因为现在要等
   确认（P2P最多2.5秒，中转再加最多4秒），不能卡住发送框清空这个操作的即时
   反馈，所以放后台跑，UI 那边已经乐观更新过了（本地已经存库、已经显示在
   聊天记录里）。
   已去掉服务端离线队列兜底：送不达就把本地那条消息标记为delivered:false，
   放着不管——真正送达由 resendUndeliveredTo（P2P一接通就补发）和
   retryUndeliveredViaRelay（周期性经中转重试）两条路径负责补发。
   关键点：P2P没打通不代表没送达——很多时候两边都在线，只是恰好没建起
   直连，这种情况下经CF中转其实是能实时送到对方的，所以中转这条路径也要
   真的等对方确认（sendViaRelayAndWaitAck），而不是"发出去就当送达"，
   否则会出现对方明明收到了、这边却一直显示"未送达"的问题。 */
async function deliverMessage(convo, payload){
  const isGroup = convo.type==='group';
  let delivered;
  if(isGroup){
    // 群人数上限只有10人（GROUP_MAX_MEMBERS），mesh直连是可行的——谁发消息，
    // 谁负责把这条消息广播给当前已经跟自己建立了P2P直连的成员，等对方ACK
    // 确认才算数（sendReliable）。CF群房间始终也广播一份兜底（不管P2P是否
    // 已经成功，遗漏的成员靠这份兜底收到），如果一个P2P确认都没拿到，就
    // 顺手等一下中转确认，看是不是至少有人在线收到了。
    const members = (convo.members||[]).filter(uid=>uid!==state.me.userId);
    const results = await Promise.all(members.map(uid=> P2P.sendReliable(uid, payload).then(ok=>({uid,ok}))));
    const p2pOk = members.length===0 || results.some(r=>r.ok);
    if(p2pOk){
      BubbleComm.send(wireRoomFor(convo), payload); // 没确认的成员照样发一份兜底，不用等
      delivered = true;
    } else {
      delivered = await sendViaRelayAndWaitAck(wireRoomFor(convo), payload, 4000);
    }
  } else {
    // 1:1：先试P2P，等ACK确认；没确认（包括通道本来就没打开、或者发了没
    // 收到ACK）就走CF中转，但中转这次也要真的等对方确认收到，不是发出去
    // 就直接算数——两边其实都在线、只是没打通P2P直连是很常见的情况，中转
    // 完全可能实时送达。
    delivered = await P2P.sendReliable(convo.id, payload);
    if(!delivered){
      P2P.connect(convo.id); // 顺手尝试把直连建起来，下次就不用走中转了
      delivered = await sendViaRelayAndWaitAck(wireRoomFor(convo), payload, 4000);
    }
  }
  await BubbleDB.markMessageDelivered(payload.msgId, delivered);
  if(state.activeConvoId===convo.id) renderMain();
}

/* 群资料变更/解散广播——群名、头像、保留时长这些以前只改了群主自己本地那份，
   群成员那边永远不会同步；解散群也只是群主本地删了记录，成员那边还在正常
   收发消息。这两个都复用 deliverMessage 已有的"群mesh直连+CF兜底"逻辑，
   和群聊消息走的是同一套可靠投递机制，用群密钥加密（毕竟内容也就是群名这种
   不算特别敏感但也没必要让CF看到明文的信息，和聊天消息一个标准）。 */
async function broadcastGroupUpdate(g, patch){
  if(!g.groupKeyB64) return;
  const key = await BubbleCrypto.importGroupKey(g.groupKeyB64);
  const envelope = await BubbleCrypto.encryptText(key, JSON.stringify(patch));
  const payload = {kind:'group_update', isGroup:true, convId:g.id, msgId:'gu_'+crypto.randomUUID(), from: state.me.userId, envelope};
  deliverMessage(g, payload);
}
async function broadcastGroupDissolved(g){
  if(!g.groupKeyB64) return;
  const key = await BubbleCrypto.importGroupKey(g.groupKeyB64);
  const envelope = await BubbleCrypto.encryptText(key, JSON.stringify({}));
  const payload = {kind:'group_dissolved', isGroup:true, convId:g.id, msgId:'gd_'+crypto.randomUUID(), from: state.me.userId, envelope};
  await deliverMessage(g, payload); // 这次要等它——发完这一下马上就要把 g 从本地删掉了
}

async function handleIncoming(roomId, payload, viaP2P){
  if(!payload || payload.from===state.me.userId) return;

  // 经CF中转送达确认——见 sendViaRelayAndWaitAck / pendingRelayAcks。这是
  // 控制消息，不进后面任何业务逻辑。chat-ack对应聊天消息（按msgId匹配），
  // proto-ack对应加好友请求/同意这类一次性协议消息（按reqId匹配）
  if(payload.kind === 'chat-ack'){
    const resolve = pendingRelayAcks.get(payload.msgId);
    if(resolve){ pendingRelayAcks.delete(payload.msgId); resolve(); }
    return;
  }
  if(payload.kind === 'proto-ack'){
    const resolve = pendingRelayAcks.get(payload.reqId);
    if(resolve){ pendingRelayAcks.delete(payload.reqId); resolve(); }
    return;
  }

  // 群主改了群名/头像/保留时长——用群密钥解出补丁，合并到本地那份群资料上
  if(payload.kind === 'group_update'){
    const g = state.convos.find(c=>c.id===payload.convId);
    if(!g || !g.groupKeyB64) return;
    const key = await BubbleCrypto.importGroupKey(g.groupKeyB64);
    let patch;
    try{ patch = JSON.parse(await BubbleCrypto.decryptText(key, payload.envelope)); }
    catch(e){ console.warn('[crypto] group_update decrypt failed', e); return; }
    Object.assign(g, patch);
    g.updatedAt = Date.now();
    await BubbleDB.upsertConvo(g);
    renderAll();
    return;
  }
  // 群主解散了群——本地也跟着删，不然群主已经不在了，成员这边还留着个"僵尸群"能收发消息
  if(payload.kind === 'group_dissolved'){
    const g = state.convos.find(c=>c.id===payload.convId);
    if(!g) return;
    BubbleComm.leaveRoom(wireRoomFor(g));
    await BubbleDB.deleteConvo(g.id);
    state.convos = state.convos.filter(c=>c.id!==g.id);
    if(state.activeConvoId===g.id){ state.activeConvoId=null; state.screenStack=[]; }
    showToast(currentLang==='zh' ? `群"${g.name}"已被群主解散` : `Group "${g.name}" was dissolved by the owner`);
    renderAll();
    return;
  }

  // 群邀请——通过我自己的"个人信箱"房间送达（见 enterApp/inviteMembersToGroup）。
  // 点对点加密（邀请人 -> 我），邀请里带着群共享密钥，所以要跟普通1:1消息
  // 一样的保护级别。
  if(payload.kind === 'invite_env'){
    if(roomId !== state.me.userId) return;
    const invite = await decryptFromPeer(payload.from, payload.envelope);
    if(!invite) return; // 解不开——直接丢弃，不去猜内容
    if(state.convos.find(c=>c.id===invite.gid)) return; // 这个群已经知道了，不用重复处理
    showModal({ title:t('join_group'), body:escapeHtml(invite.name||invite.gid), onConfirm: async ()=>{
      const room = {id:invite.gid, type:'group', name:invite.name||invite.gid, avatarEmoji:invite.avatarEmoji||'💬',
        color:invite.color||'#37C9B9', ephemeral: !!invite.ephemeral, ttlMs: invite.ttlMs||null,
        members: invite.members||[], owner: invite.owner||null, createdAt: invite.createdAt||Date.now(), updatedAt:Date.now(),
        groupKeyB64: invite.groupKeyB64};
      await BubbleDB.upsertConvo(room);
      state.convos.unshift(room);
      BubbleComm.joinRoom(room.id);
      renderAll();
    }});
    return;
  }

  // 对方想加我为好友。默认需要我手动确认（防止被随便加、收垃圾消息）；
  // 如果我在设置里关掉了"需要验证"，就直接自动同意。
  if(payload.kind === 'friend_request_env'){
    if(roomId !== state.me.userId) return;
    const info = await decryptFromPeer(payload.from, payload.envelope);
    if(!info) return;
    // 不管是不是第一次收到，只要能确认这条请求确实是发给我的，就先回一个
    // 确认——哪怕已经是好友了、这是条重复请求，也照样回，不然对方会一直
    // 重试下去（见 sendFriendProtocolMsg）
    if(payload.reqId) BubbleComm.send(roomId, {kind:'proto-ack', reqId:payload.reqId, from:state.me.userId});
    // 用数据库里的最新记录来判断，不信内存里的state.friends——这是处理
    // "对方明明已经通过验证，我这边却又把状态打回待验证"这类问题的一道
    // 保险：万一内存跟数据库之间因为别的路径没同步好而不一致，这里宁可
    // 多一次读库开销，也不要让判断建立在可能过期的数据上
    state.friends = await BubbleDB.listFriends();
    const existing = state.friends.find(f=>f.userId===payload.from);
    if(existing && (!existing.status || existing.status==='accepted')){
      // 已经是好友了——这多半是对方那边一直没收到我之前发的"同意"回执，
      // 于是又重新发了一次请求过来（见 sendFriendProtocolMsg 的重试机制）。
      // 光回一个上面那句 proto-ack 是不够的：proto-ack只代表"这条请求送到
      // 我这儿了"，并不会让对方本地的好友状态翻转成"已同意"，对方那边
      // 判断"是否已确认"靠的是真正收到一条 friend_accept_env（见下面
      // 'friend_accept_env' 分支）。如果这里什么都不做，两边会卡死：对方
      // 永远停在"待验证"，而对方发送时的重试循环又已经因为收到这个
      // proto-ack提前退出了，不会再发第二次请求，双方再也没有下一次交互
      // 去触发一轮新的确认——所以必须重新发一次真正的 friend_accept_env。
      // 不等它发完（内部有约20秒的退避重试）——不能让处理一条incoming消息
      // 卡住后面消息的处理。
      sendFriendProtocolMsg(payload.from, 'friend_accept_env', mySelfInfo()).catch(err=> console.warn('[好友] 补发同意回执失败', err));
      return;
    }
    const autoAccept = state.me.requireFriendConfirm === false;
    const friend = { userId:payload.from, nickname:info.nickname||payload.from, avatarEmoji:info.avatarEmoji||'🙂',
      color:info.color||'#37C9B9', publicKeyB64:info.publicKeyB64, addedAt:Date.now(), remark:'',
      status: autoAccept ? 'accepted' : 'pending_in' };
    await BubbleDB.upsertFriend(friend);
    state.friends = state.friends.filter(f=>f.userId!==friend.userId);
    state.friends.push(friend);
    if(autoAccept){
      sendFriendProtocolMsg(payload.from, 'friend_accept_env', mySelfInfo()).catch(err=> console.warn('[好友] 自动同意回执发送失败', err));
      const convo = await ensureConvoWithFriend(payload.from);
      BubbleComm.joinRoom(wireRoomFor(convo));
      P2P.connect(payload.from);
      showToast(currentLang==='zh' ? `${friend.nickname} 加你为好友` : `${friend.nickname} added you as a friend`);
    } else {
      showToast(currentLang==='zh' ? `${friend.nickname} 请求加你为好友` : `${friend.nickname} wants to add you as a friend`);
    }
    renderAll();
    return;
  }

  // 对方同意了我之前发的好友请求
  if(payload.kind === 'friend_accept_env'){
    if(roomId !== state.me.userId) return;
    const info = await decryptFromPeer(payload.from, payload.envelope);
    if(!info) return;
    if(payload.reqId) BubbleComm.send(roomId, {kind:'proto-ack', reqId:payload.reqId, from:state.me.userId});
    // 同样先以数据库为准重新读一遍，不信内存里可能过期的state.friends
    state.friends = await BubbleDB.listFriends();
    let existing = state.friends.find(f=>f.userId===payload.from);
    if(!existing){
      // 正常情况下不该发生——我既然收到"对方同意了我的请求"，本地必然
      // 已经有一条我自己发起时创建的pending_out记录。但万一真的因为某些
      // 意外（比如浏览器数据被清过一部分）找不到，也不要把这条确认直接
      // 丢掉——用回执里带的信息现建一条，好过让对方那边显示"已同意"、
      // 这边却完全没反应
      existing = { userId: payload.from, nickname: info.nickname||payload.from, avatarEmoji: info.avatarEmoji||'🙂', color: info.color||'#37C9B9', addedAt: Date.now(), remark:'' };
      state.friends.push(existing);
    }
    existing.status = 'accepted';
    existing.nickname = info.nickname || existing.nickname;
    existing.avatarEmoji = info.avatarEmoji || existing.avatarEmoji;
    existing.publicKeyB64 = info.publicKeyB64 || existing.publicKeyB64;
    await BubbleDB.upsertFriend(existing);
    const convo = await ensureConvoWithFriend(payload.from);
    BubbleComm.joinRoom(wireRoomFor(convo));
    P2P.connect(payload.from);
    showToast(currentLang==='zh' ? `对方已同意你的好友请求` : `They accepted your friend request`);
    renderAll();
    return;
  }

  // WebRTC 握手消息（offer/answer/ice），经由对方个人信箱转发过来，解密后
  // 交给 P2P 模块处理，不进入下面的聊天消息逻辑
  if(payload.kind === 'rtc_sig_env'){
    if(roomId !== state.me.userId) return;
    const signal = await decryptFromPeer(payload.from, payload.envelope);
    if(!signal) return;
    await P2P.handleSignal(payload.from, signal);
    return;
  }

  if(payload.kind !== 'chat') return;
  let convo;
  if(payload.isGroup){
    convo = state.convos.find(c=>c.id===payload.convId);
    if(!convo) return; // 群聊但本地压根没这个会话——没什么安全的办法能凭空造一个，直接丢弃
  } else {
    convo = state.convos.find(c=>c.id===payload.from && c.type==='single');
    if(!convo){
      // 还没有1:1会话——大概率是对方的好友申请通知还没送达我（丢了，或者
      // 对方发的时候我不在线）。与其把这条消息也丢掉，不如就用能拿到的
      // 信息现造一个最简版的好友/会话记录出来，让消息能落地。
      const profile = state.profileCache[payload.from] || await BubbleCF.getProfile(payload.from) || {userId:payload.from, nickname:payload.from, avatarEmoji:'🙂', color:'#37C9B9'};
      if(!state.friends.find(f=>f.userId===payload.from)){
        const friend = { ...profile, addedAt:Date.now(), remark:'', status:'accepted' };
        await BubbleDB.upsertFriend(friend);
        state.friends.push(friend);
      }
      convo = {id:payload.from, type:'single', name:profile.nickname, avatarEmoji:profile.avatarEmoji, color:profile.color, updatedAt:Date.now()};
      await BubbleDB.upsertConvo(convo);
      state.convos.unshift(convo);
    }
    // 确保确实加入了这一对好友的dm房间——刚在上面新建会话时，或者消息来自
    // 一个已加好友但还从没打开过聊天窗口的人时，都需要这一步
    BubbleComm.joinRoom(wireRoomFor(convo));
  }

  // 解出真正的消息正文——群聊用共享群密钥，1:1用跟发送者之间的ECDH点对点密钥
  let secret;
  if(payload.isGroup){
    if(!convo.groupKeyB64) return; // 正常邀请流程走完不该出现这种情况，但绝不能退化成明文处理
    const key = await BubbleCrypto.importGroupKey(convo.groupKeyB64);
    try{ secret = JSON.parse(await BubbleCrypto.decryptText(key, payload.envelope)); }
    catch(e){ console.warn('[crypto] group message decrypt failed', e); return; }
  } else {
    secret = await decryptFromPeer(payload.from, payload.envelope);
    if(!secret) return;
  }

  const msgConvId = convo.id;
  const alreadyHave = await BubbleDB.getMessage(payload.msgId);
  // 排序用发送方原始的发送时间（payload.createdAt），不是本地收到的时间——
  // 断线补发的消息可能因为重试节奏、P2P/中转两条通道的竞速而不是严格按
  // 原顺序到达，如果拿"我这边收到的时刻"来排序，聊天记录里几条消息的
  // 先后顺序就会被打乱。老版本的对端可能还没有这个字段，兜底退回收到时刻。
  const msg = {msgId:payload.msgId, convId:msgConvId, from:payload.from, type:secret.type, content:secret.content,
    createdAt: alreadyHave ? alreadyHave.createdAt : (payload.createdAt || Date.now()), expiresAt:payload.expiresAt||null, delivered:true};
  await BubbleDB.addMessage(msg);
  // 经CF中转收到的（不是经P2P数据通道——那条路径的ack已经在P2P模块内部
  // 处理过了），回一个"我收到了"给发送方，让对方那边能把"未送达"标记翻转
  // 过来。哪怕是重复收到的消息也照样回一次ack，防止上一次的ack本身在半路
  // 丢了，导致对方一直卡在"未送达"、明明我这边其实早就收到了。
  if(!viaP2P && payload.msgId){
    BubbleComm.send(roomId, {kind:'chat-ack', msgId:payload.msgId, from:state.me.userId});
  }
  convo.updatedAt = Date.now();
  convo.lastPreview = previewFor(msg);
  const isTrulyNew = !alreadyHave && payload.from!==state.me.userId;
  if(state.activeConvoId !== msgConvId && isTrulyNew) convo.unread = (convo.unread||0)+1;
  if(isTrulyNew){
    playMessageSound(); // 只有真正的新消息才响，重复投递/自己发的不响
    // 不在这个会话的聊天界面里，才弹顶部提醒浮层——正看着这个人的聊天窗口时，
    // 消息已经实时出现在聊天记录里了，再弹一次浮层反而是打扰
    if(state.activeConvoId !== msgConvId) showIncomingMsgBanner(convo, msg);
  }
  await BubbleDB.upsertConvo(convo);
  if(state.activeConvoId===msgConvId) await renderMain(); else renderAll();
}

/* 把入群邀请发到每个被邀请人的"个人信箱"房间（他们自己的userId——见
   enterApp里的BubbleComm.joinRoom(state.me.userId)）。这是新建群组真正
   传达到被邀请人客户端的唯一途径，没有这一步创建群组就只是本地写了条
   数据库记录，别人完全看不到。整个邀请（包括群共享密钥）用点对点方式
   加密（我 -> 这一个被邀请人），和普通1:1消息用的是同一套加密标准。
   注意：已去掉服务端离线队列兜底——如果被邀请人这一刻不在线（没有连着
   自己的信箱房间），这条邀请会丢失，需要群主之后手动重新邀请一次。 */
async function inviteMembersToGroup(room, uids){
  for(const uid of uids){
    if(uid === state.me.userId) continue;
    const invite = {
      gid: room.id, name: room.name, avatarEmoji: room.avatarEmoji, color: room.color,
      ephemeral: room.ephemeral, ttlMs: room.ttlMs, owner: room.owner,
      members: room.members, createdAt: room.createdAt, groupKeyB64: room.groupKeyB64
    };
    const envelope = await encryptForPeer(uid, invite);
    if(!envelope){ console.warn('[crypto] cannot invite', uid, '— no public key available yet'); continue; }
    const payload = {kind:'invite_env', from: state.me.userId, envelope};
    // 实时尝试发送，万一对方这会儿正好在线
    BubbleComm.send(uid, payload);
    setTimeout(()=> BubbleComm.leaveRoom(uid), 3000);
  }
}
function previewFor(m){
  if(m.type==='text') return m.content;
  if(m.type==='voice') return currentLang==='zh'?'[语音]':'[Voice]';
  if(m.type==='image') return currentLang==='zh'?'[图片]':'[Image]';
  if(m.type==='file') return currentLang==='zh'?'[文件] '+m.content.name:'[File] '+m.content.name;
  if(m.type==='call') return callPreviewText(m.content);
  return '';
}
function onPickImage(e){
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = (ev)=> sendMessage('image', ev.target.result);
  reader.readAsDataURL(f);
  e.target.value='';
}
function onPickFile(e){
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = (ev)=> sendMessage('file', {name:f.name, size:f.size, dataUrl: ev.target.result});
  reader.readAsDataURL(f);
  e.target.value='';
}

/* 定期清理临时群组 */
setInterval(async ()=>{
  if(!state.authed) return;
  await BubbleDB.purgeExpiredMessages();
  const before = state.convos.length;
  state.convos = await BubbleDB.listConvos();
  if(state.convos.length !== before){
    if(state.activeConvoId && !state.convos.find(c=>c.id===state.activeConvoId)){
      state.activeConvoId = null;
    }
    renderAll();
  }
}, 60000);

bootstrap();
</script>
