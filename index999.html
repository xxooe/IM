// 我自己的公开信息（昵称/头像/公钥），发好友请求/同意好友请求时都要带上，让对方能建立起和我的加密通道
function mySelfInfo(){
  return { nickname: state.me.nickname, avatarEmoji: state.me.avatarEmoji, color: state.me.color, publicKeyB64: state.me.publicKeyB64 };
}

// 通过对方的"个人信箱"发一条好友协议消息（请求/同意），加密后走CF信令实时
// 发送——并且真的等对方确认收到（复用聊天消息那一套 sendViaRelayAndWaitAck /
// pendingRelayAcks 机制，而不是"发出去就算数"）。加好友、验证、验证通过这几
// 步必须做到"确保对方收到"，不然会出现请求卡住、对方一直看不到验证、或者
// 验证完了对方却收不到回执的问题。等不到确认就重试，按退避节奏尽量覆盖对方
// 短暂掉线重连的窗口，总共大约30秒；调用方可以传 stopIf，在目标已经达成时
// 提前收手（比如本地记录已经显示对方确认过了）。
// 硬性要求：好友请求/验证消息永远只走CF中转（BubbleComm/sendViaRelayAndWaitAck），
// 绝不能改成走P2P直连——加好友这一步双方本来就还不是好友，根本不存在可用
// 的P2P连接，如果以后误改成依赖P2P，会导致P2P打不通时好友申请直接卡死。
async function sendFriendProtocolMsg(peerUid, kind, info, opts={}){
  const envelope = await encryptForPeer(peerUid, info);
  if(!envelope){ console.warn('[crypto] 发送', kind, '失败——暂时拿不到对方公钥', peerUid); return false; }
  const reqId = 'fp_'+crypto.randomUUID();
  const payload = {kind, from: state.me.userId, envelope, reqId};
  const waitBetween = [1000, 2000, 4000, 8000]; // 每次没等到确认之后，再等多久重试一次
  let acked = false;
  for(let i=0; i<=waitBetween.length; i++){
    if(opts.stopIf && opts.stopIf()) break;
    acked = await sendViaRelayAndWaitAck(peerUid, payload, 3000); // 真的等对方确认收到
    if(acked) break;
    if(i < waitBetween.length) await new Promise(r=> setTimeout(r, waitBetween[i]));
  }
  setTimeout(()=> BubbleComm.leaveRoom(peerUid), 3000);
  return acked;
}

/* 发起加好友请求——不再是"点了就直接成为好友"，而是本地先记一条"验证中"的
   记录，等对方确认（或者对方设置了"免验证"，会自动帮我确认）。
   之前叫 addFriendAndRefresh，这次改名是因为行为彻底变了，避免调用方以为
   点了就立刻成好友。 */
async function sendFriendRequest(u){
  if(!u) return;
  const existing = state.friends.find(f=>f.userId===u.userId);
  if(existing){
    const st = existing.status || 'accepted';
    if(st==='accepted') return; // 已经是好友了
    if(st==='pending_out'){ showToast(currentLang==='zh'?'已经发送过请求，等待对方确认':'Request already sent — waiting for confirmation'); return; }
    if(st==='pending_in'){ await acceptFriendRequest(existing); return; } // 对方其实也申请加我了，直接互相同意
  }
  const friend = { ...u, addedAt: Date.now(), remark:'', status:'pending_out' };
  await BubbleDB.upsertFriend(friend);
  state.friends.push(friend);
  showToast(currentLang==='zh' ? '已发送好友请求，等待对方确认' : 'Friend request sent — waiting for confirmation');
  // 不等下面这个发出去——sendFriendProtocolMsg内部有一套持续约20秒的退避
  // 重试，点"添加"之后如果卡在这里等它跑完，按钮/弹窗会看起来像卡死了一样
  // （这正是之前的一个bug：点了没反应，等好一会儿才突然有动静）。上面的
  // 本地写库+提示已经是即时反馈了，网络层的重试留在后台跑，不影响界面。
  sendFriendProtocolMsg(u.userId, 'friend_request_env', mySelfInfo(), {
    // 对方一旦确认（本地记录不再是"待验证"）就不用继续重试了——多半是对方
    // 已经收到并同意，或者反过来对方也申请了我、我们在别处已经互相确认过了
    stopIf: ()=>{ const f = state.friends.find(x=>x.userId===u.userId); return !f || f.status!=='pending_out'; }
  }).catch(err=> console.warn('[好友] 请求重试失败', err));
}

/* 手动"重新验证"——之前的自动重试只在申请那一刻起算的大约30秒内有效，超过
   这个窗口就彻底不再重试了。有些情况下（对方那会儿真的不在线，或者中间
   哪一步信令没送到）30秒根本不够，双方就会一直卡在"待验证"，谁都没法
   继续。这里给一个手动兜底：不管等了多久，随时可以在"待验证"的界面上
   点这个按钮，再发一轮完整的请求（对方即使已经通过了也没关系——见
   handleIncoming 的 friend_request_env 分支，收到重复请求会自动补发一次
   同意回执，不会把已经同意的状态搞乱）。 */
async function resendFriendRequest(uid){
  const f = state.friends.find(x=>x.userId===uid);
  if(!f || f.status!=='pending_out'){
    if(f && f.status==='accepted') showToast(currentLang==='zh'?'已经是好友了':'Already friends');
    return;
  }
  showToast(currentLang==='zh' ? '已重新发送验证请求' : 'Verification request resent');
  sendFriendProtocolMsg(uid, 'friend_request_env', mySelfInfo(), {
    stopIf: ()=>{ const ff = state.friends.find(x=>x.userId===uid); return !ff || ff.status!=='pending_out'; }
  }).catch(err=> console.warn('[好友] 重新验证发送失败', err));
}

// 我这边接受一条对方发来的好友请求：本地记录升级成正式好友，并回复一条"我同意了"给对方
async function acceptFriendRequest(pending){
  pending.status = 'accepted';
  await BubbleDB.upsertFriend(pending);
  state.friends = await BubbleDB.listFriends(); // 以数据库为准重新加载一遍，避免任何内存引用不同步的可能
  const convo = await ensureConvoWithFriend(pending.userId);
  BubbleComm.joinRoom(wireRoomFor(convo));
  P2P.connect(pending.userId);
  showToast(currentLang==='zh' ? `你和 ${pending.nickname} 成为好友了` : `You and ${pending.nickname} are now friends`);
  renderAll();
  // 同样不等这个发出去——本地这边已经是好友了，UI已经更新完毕，剩下只是
  // "让对方也知道"，这一步有自己的重试机制在后台跑，不该让"点接受"这个
  // 操作卡住界面约20秒。
  sendFriendProtocolMsg(pending.userId, 'friend_accept_env', mySelfInfo()).catch(err=> console.warn('[好友] 同意回执重试失败', err));
}
// 拒绝：本地直接删掉这条待处理记录，不额外通知对方（避免再造一套"已拒绝"协议）
async function declineFriendRequest(pending){
  await BubbleDB.deleteFriend(pending.userId);
  state.friends = state.friends.filter(f=>f.userId!==pending.userId);
  renderAll();
}

/* ================= 扫码 ================= */
async function startScan(purpose){
  const video = document.getElementById('scan-video');
  if(!video) return;
  try{
    // 用"理想值"而不是"精确值"约束：大多数手机摄像头不加约束时默认分辨率
    // 比这个高得多，而每一帧都对满分辨率（比如4K）跑一次getImageData()+
    // jsQR()太慢了，实际上每秒真正被处理、还没运动模糊的帧没几个——这才是
    // "代码逻辑明明没错，识别率却很低"的常见原因。这里先限制摄像头的请求
    // 分辨率从源头解决；下面对canvas做的降采样，是应对那些不遵守约束的
    // 摄像头的第二道保险。
    scanStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'environment', width:{ideal:1280}, height:{ideal:720} }
    });
    video.srcObject = scanStream;
    await video.play();
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    const MAX_DIM = 720; // 限制jsQR实际处理的帧尺寸上限
    const tick = ()=>{
      if(!video.videoWidth){ scanRafId = requestAnimationFrame(tick); return; }
      const scale = Math.min(1, MAX_DIM / Math.max(video.videoWidth, video.videoHeight));
      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const result = window.jsQR ? jsQR(imgData.data, imgData.width, imgData.height, {inversionAttempts:'attemptBoth'}) : null;
      if(result && result.data){ handleScannedPayload(result.data); return; }
      scanRafId = requestAnimationFrame(tick);
    };
    scanRafId = requestAnimationFrame(tick);
  }catch(e){
    document.querySelector('.scan-video-wrap').innerHTML = `<div style="color:#fff;padding:24px;text-align:center;">${t('camera_denied')}</div>`;
  }
}
function stopScan(){
  if(scanRafId) cancelAnimationFrame(scanRafId); scanRafId=null;
  if(scanStream){ scanStream.getTracks().forEach(tr=>tr.stop()); scanStream=null; }
}
function openScan(purpose){ pushScreen({type:'scan', purpose}); }

async function handleScannedPayload(text){
  let payload;
  try{ payload = JSON.parse(text); }
  catch(e){
    console.warn('[scan] not JSON, ignoring frame:', text);
    showToast(currentLang==='zh' ? '未识别到有效二维码，请对准泡泡IM生成的码' : 'Not a recognized code — point at a BubbleIM-generated QR');
    // 继续扫——画面里偶尔出现一个非JSON的二维码（比如背景里的广告海报）
    // 不该导致整个扫码会话中断
    return;
  }
  stopScan();
  if(payload.t==='friend' && payload.uid){
    if(payload.uid === state.me.userId){
      showToast(currentLang==='zh' ? '这是你自己的二维码' : "That's your own QR code");
      state.screenStack.pop(); renderAll();
      return;
    }
    showModal({ title:t('add_confirm'), body:escapeHtml(payload.nickname||payload.uid), onConfirm: async ()=>{
      await sendFriendRequest({userId:payload.uid, nickname:payload.nickname||payload.uid, avatarEmoji:payload.avatarEmoji||'🙂', publicKeyB64:payload.publicKeyB64});
      state.screenStack = [];
      renderAll();
    }});
  } else if(payload.t==='group' && payload.gid){
    // 注意：目前应用里没有任何地方会生成"群"类型的二维码（screenQrCode
    // 只会编码加好友的payload），所以这个分支眼下走不到。以后如果加了
    // 群二维码生成功能，一定要记得带上groupKeyB64（参见
    // inviteMembersToGroup），否则扫码进群的设备会拿到一个永远解不开
    // 任何消息的群。
    showModal({ title:t('join_group'), body:escapeHtml(payload.name||payload.gid), onConfirm: async ()=>{
      const room = {id:payload.gid, type:'group', name:payload.name||payload.gid, avatarEmoji:'💬', color:'#37C9B9',
        ephemeral:true, ttlMs:24*60*60*1000, members:[], owner: payload.ownerId || null, createdAt: payload.createdAt || Date.now(), updatedAt:Date.now(),
        groupKeyB64: payload.groupKeyB64 || null};
      await BubbleDB.upsertConvo(room);
      state.convos.unshift(room);
      BubbleComm.joinRoom(room.id);
      state.screenStack = [];
      openConvo(room.id);
    }});
  } else {
    showToast(currentLang==='zh' ? '二维码格式不支持' : 'Unsupported QR code format');
    state.screenStack.pop(); renderAll();
  }
}

/* ================= 聊天 ================= */
async function openConvo(id){
  state.activeConvoId = id;
  state.msgSelectMode = false;
  state.selectedMsgIds = new Set();
  const c = state.convos.find(x=>x.id===id);
  if(c){
    BubbleComm.joinRoom(wireRoomFor(c));
    if(c.type==='single') P2P.connect(c.id); // 打开1:1聊天时顺手尝试建立直连，不阻塞界面
    if(c.unread){ c.unread = 0; await BubbleDB.upsertConvo(c); }
  }
  state.screenStack = [];
  renderAll();
}

/* ================= 消息删除（单条 / 多选 / 清空） ================= */
// 长按（或桌面右键）一条消息弹出的操作菜单：删除这一条，或者进入多选模式
function openMsgActionSheet(msgId, convo){
  showSheet([
    {ic:'trash', label: currentLang==='zh'?'删除':'Delete', action: ()=> confirmDeleteOneMessage(msgId, convo)},
    {ic:'check', label: currentLang==='zh'?'多选':'Select multiple', action: ()=>{
      state.msgSelectMode = true;
      state.selectedMsgIds = new Set([msgId]);
      renderMain();
    }}
  ]);
}
function toggleMsgSelect(msgId){
  if(!msgId) return;
  if(state.selectedMsgIds.has(msgId)) state.selectedMsgIds.delete(msgId);
  else state.selectedMsgIds.add(msgId);
  renderMain();
}
function exitMsgSelectMode(){
  state.msgSelectMode = false;
  state.selectedMsgIds = new Set();
  renderMain();
}
// 删完消息之后，会话列表的"最后一条消息预览"要跟着刷新——如果删的正好是
// 最后一条，就重新拿一次列表里现在最新的那条；聊天记录被清空的话就置空
async function refreshConvoPreviewAfterDelete(convo){
  const remaining = await BubbleDB.listMessages(convo.id);
  const last = remaining[remaining.length-1];
  convo.lastPreview = last ? previewFor(last) : '';
  await BubbleDB.upsertConvo(convo);
}
function confirmDeleteOneMessage(msgId, convo){
  showModal({
    title: currentLang==='zh'?'删除这条消息？':'Delete this message?',
    body: currentLang==='zh'?'仅从本机删除，不会通知对方':'This only removes it from this device — the other side keeps their copy',
    onConfirm: async ()=>{
      await BubbleDB.deleteMessage(msgId);
      await refreshConvoPreviewAfterDelete(convo);
      if(state.activeConvoId===convo.id) renderMain(); else renderAll();
    }
  });
}
function confirmDeleteSelectedMessages(){
  const convo = state.convos.find(c=>c.id===state.activeConvoId);
  if(!convo || state.selectedMsgIds.size===0) return;
  const ids = Array.from(state.selectedMsgIds);
  showModal({
    title: currentLang==='zh'?`删除选中的 ${ids.length} 条消息？`:`Delete ${ids.length} selected messages?`,
    body: currentLang==='zh'?'仅从本机删除，不会通知对方':'This only removes them from this device — the other side keeps their copy',
    onConfirm: async ()=>{
      await BubbleDB.deleteMessages(ids);
      state.msgSelectMode = false;
      state.selectedMsgIds = new Set();
      await refreshConvoPreviewAfterDelete(convo);
      renderMain();
    }
  });
}
function confirmClearConvoMessages(convo){
  showModal({
    title: currentLang==='zh'?'清空聊天记录？':'Clear chat history?',
    body: currentLang==='zh'?`将删除与"${escapeHtml(displayNameForConvo(convo))}"的全部本地聊天记录，仅影响本机，无法恢复`:`This deletes all local chat history with "${escapeHtml(displayNameForConvo(convo))}" on this device only — it can't be undone`,
    onConfirm: async ()=>{
      await BubbleDB.deleteMessagesForConvo(convo.id);
      convo.lastPreview = '';
      await BubbleDB.upsertConvo(convo);
      if(state.activeConvoId===convo.id) renderMain(); else renderAll();
    }
  });
}

// 轻量更新聊天头部那个"直连/中转"状态小标签，不做整屏重渲染（避免打断正在看消息的滚动位置）
function updateP2PBadge(peerUid){
  const connected = P2P.isChannelOpen(peerUid);
  if(state.activeConvoId === peerUid){
    const el = document.getElementById('chat-p2p-badge');
    if(el){
      el.textContent = connected ? (currentLang==='zh'?'🔒 直连':'🔒 Direct') : (currentLang==='zh'?'○ 经中转':'○ Relayed');
      el.classList.toggle('p2p-on', connected);
    }
  }
  // 通讯录里那个在线小圆点也顺手更新一下（如果正好能看到的话），不用整屏重渲染
  const dot = document.querySelector(`[data-friend="${peerUid}"] .status-dot`);
  if(dot){ dot.classList.toggle('online', connected); dot.classList.toggle('offline', !connected); }
}

let holdStartY = 0;
function beginRecording(e){
  holdStartY = (e.touches ? e.touches[0].clientY : e.clientY);
  recordCancelled = false;
  document.getElementById('rec-hint').textContent = t('release_to_send');
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    recStream = stream;
    recorderChunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (ev)=>{ if(ev.data.size>0) recorderChunks.push(ev.data); };
    recorder.start();
    recordStartTs = Date.now();
    document.getElementById('holdBtn').classList.add('recording');
    document.getElementById('holdBtn').textContent = t('release_to_send');
    const overlay = document.getElementById('record-overlay');
    overlay.classList.add('show');

    const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    recAnalyser = audioCtx.createAnalyser(); recAnalyser.fftSize = 64;
    source.connect(recAnalyser);
    const data = new Uint8Array(recAnalyser.frequencyBinCount);
    const bars = document.querySelectorAll('#rec-bars span');
    const tick = ()=>{
      recAnalyser.getByteFrequencyData(data);
      bars.forEach((b,i)=>{ const v = data[i%data.length]||0; b.style.height = Math.max(6, (v/255)*26) + 'px'; });
      document.getElementById('rec-time').textContent = ((Date.now()-recordStartTs)/1000).toFixed(1)+'s';
      recAnimId = requestAnimationFrame(tick);
    };
    tick();
  }).catch(()=>{
    alert(currentLang==='zh'?'需要麦克风权限才能发送语音':'Microphone permission is required to send voice messages');
  });
}
function endRecording(send){
  const overlay = document.getElementById('record-overlay');
  overlay.classList.remove('show'); overlay.classList.remove('cancel');
  if(recAnimId) cancelAnimationFrame(recAnimId);
  document.getElementById('holdBtn')?.classList.remove('recording');
  if(document.getElementById('holdBtn')) document.getElementById('holdBtn').textContent = t('hold_to_talk');
  if(!recorder || recorder.state==='inactive'){ cleanupRecording(); return; }
  const shouldSend = send && !recordCancelled;
  recorder.onstop = ()=>{
    if(shouldSend){
      const blob = new Blob(recorderChunks, {type:'audio/webm'});
      const dur = Math.max(1, Math.round((Date.now()-recordStartTs)/1000));
      // 原始Blob没法扛住JSON.stringify（WS中继会用到）——对除发送者本人以外
      // 的任何人，它都会悄无声息地变成{}（发送者自己是从本地IndexedDB副本
      // 播放的，根本不会发现问题）。所以跟图片/文件一样，统一转成Base64
      // data URL再发。
      const reader = new FileReader();
      reader.onload = (ev)=> sendMessage('voice', {dataUrl: ev.target.result, dur});
      reader.readAsDataURL(blob);
    }
    cleanupRecording();
  };
  recorder.stop();
}
function cleanupRecording(){
  if(recStream){ recStream.getTracks().forEach(tr=>tr.stop()); recStream=null; }
  recorder = null; recorderChunks = [];
}

function senderNameFor(uid){
  if(uid===state.me.userId) return state.me.nickname;
  const f = state.friends.find(x=>x.userId===uid);
  if(f) return f.remark || f.nickname;
  const cached = state.profileCache[uid];
  if(cached) return cached.nickname;
  return uid;
}

// 消息发送者的头像/昵称等完整资料——不在这里发起网络查询（避免消息列表一多，
// 一次渲染打一堆请求），只用已经有的本地好友记录/缓存，查不到就先用默认头像顶着
function senderProfileFor(uid){
  if(uid===state.me.userId) return state.me;
  const f = state.friends.find(x=>x.userId===uid);
  if(f) return f;
  const cached = state.profileCache[uid];
  if(cached) return cached;
  return {userId:uid, nickname:uid, avatarEmoji:'🙂', color:'#37C9B9'};
}

function renderBubble(m, convo){
  if(m.type==='system') return `<div class="bubble system">${escapeHtml(m.content)}</div>`;
  const isMe = m.from===state.me.userId;
  const rowCls = 'msg-row'+(isMe?' me':'');
  const profile = senderProfileFor(m.from);
  let inner;
  if(m.type==='text') inner = `<div class="bubble ${isMe?'sent':'recv'}">${escapeHtml(m.content)}</div>`;
  else if(m.type==='voice') inner = `<div class="bubble ${isMe?'sent':'recv'} voice" data-msgid="${m.msgId}"><span class="dur">${m.content.dur||1}"</span><div class="voice-wave" id="wave-${m.msgId}"><span></span><span></span><span></span><span></span></div></div>`;
  else if(m.type==='image') inner = `<div class="bubble ${isMe?'sent':'recv'} image"><img src="${m.content}"></div>`;
  else if(m.type==='file') inner = `<div class="bubble ${isMe?'sent':'recv'} file" data-dataurl="${m.content.dataUrl}" data-filename="${escapeHtml(m.content.name)}">
      <span class="file-ic">${icon('file')}</span>
      <div class="file-meta"><div class="file-name">${escapeHtml(m.content.name)}</div><div class="file-size">${formatFileSize(m.content.size)}</div></div>
    </div>`;
  else if(m.type==='call'){
    // 通话记录气泡：接通了显示"语音/视频通话 时长"，没接通（未接/拒绝/取消/忙线）
    // 显示对应文案 + 图标右下角一个红色叉号，一眼能看出"这通没打通"，跟微信的
    // 通话记录样式类似
    const c = m.content||{};
    const connected = c.status==='ended';
    inner = `<div class="bubble ${isMe?'sent':'recv'} call-bubble${connected?'':' missed'}">
        <span class="call-bubble-ic">${icon(c.video?'video':'phone')}${connected?'':'<span class="call-bubble-x">✕</span>'}</span>
        <span class="call-bubble-text">${escapeHtml(callPreviewText(c))}</span>
      </div>`;
  }
  else inner = '';
  const ephemeralTag = convo.ephemeral && m.expiresAt ? `<div class="ephemeral-tag">${new Date(m.expiresAt).toLocaleString()} ${currentLang==='zh'?'后自动清除':'auto-clear'}</div>` : '';
  // 我发出去、还没被对方确认收到的消息，小字标一下"未送达"——点一下可以
  // 手动立刻重发一次，不用干等自动重发那两条后台线路（P2P一接通触发/15秒
  // 周期兜底，见 resendUndeliveredTo / retryUndeliveredViaRelay）
  const undeliveredTag = (isMe && m.delivered===false) ? `<div class="msg-undelivered-tag" data-resend-msgid="${m.msgId}">${currentLang==='zh'?'未送达，点击重新发送':'Not delivered — tap to resend'}</div>` : '';
  const timeStr = new Date(m.createdAt||Date.now()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const metaLine = `<div class="msg-meta">${escapeHtml(senderNameFor(m.from))} · ${timeStr}</div>`;
  const avatarCol = `<div class="msg-avatar" data-avatar-uid="${m.from}">${avatarHtml(profile,'small')}</div>`;
  // 多选删除模式下，每一行前面加一个选择圆点，整行都可以点选
  const checkboxCol = state.msgSelectMode
    ? `<div class="msg-select-check ${state.selectedMsgIds.has(m.msgId)?'checked':''}" data-select-msgid="${m.msgId}">${state.selectedMsgIds.has(m.msgId)?'✓':''}</div>`
    : '';
  return `<div class="${rowCls}${state.msgSelectMode?' select-mode':''}" data-msgid="${m.msgId}">${checkboxCol}${avatarCol}<div class="msg-col">${metaLine}${inner}${ephemeralTag}${undeliveredTag}</div></div>`;
}

// 日期分隔条的文案：今天/昨天/几月几日——和微信那套逻辑一样
function formatDateSeparator(ts){
  const d = new Date(ts);
  const now = new Date();
  if(d.toDateString()===now.toDateString()) return currentLang==='zh' ? '今天' : 'Today';
  const yest = new Date(now); yest.setDate(now.getDate()-1);
  if(d.toDateString()===yest.toDateString()) return currentLang==='zh' ? '昨天' : 'Yesterday';
  if(d.getFullYear()===now.getFullYear()) return currentLang==='zh' ? `${d.getMonth()+1}月${d.getDate()}日` : d.toLocaleDateString([], {month:'short', day:'numeric'});
  return currentLang==='zh' ? `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日` : d.toLocaleDateString();
}
// 把消息列表渲染成HTML，日期变化的地方自动插入一条"今天/昨天/几月几日"的分隔条
function renderMessagesHtml(messages, convo){
  let html = '';
  let lastDateKey = null;
  for(const m of messages){
    const ts = m.createdAt || Date.now();
    const dateKey = new Date(ts).toDateString();
    if(dateKey !== lastDateKey){
      html += `<div class="date-sep"><span>${formatDateSeparator(ts)}</span></div>`;
      lastDateKey = dateKey;
    }
    html += renderBubble(m, convo);
  }
  return html;
}
function formatFileSize(bytes){
  if(!bytes && bytes!==0) return '';
  if(bytes<1024) return bytes+' B';
  if(bytes<1024*1024) return (bytes/1024).toFixed(1)+' KB';
  return (bytes/1024/1024).toFixed(1)+' MB';
}

let currentVoiceAudio = null, currentVoicePlayingId = null;
function playVoiceBubble(msgId){
  // 点的是正在播放的那一条 = 停止（切换关闭）
  if(currentVoicePlayingId === msgId){
    currentVoiceAudio?.pause();
    stopVoicePlayback();
    return;
  }
  // 切换到另一条：先停掉当前正在播的，绝不让两条语音同时叠在一起播
  if(currentVoiceAudio) currentVoiceAudio.pause();
  stopVoicePlayback();

  BubbleDB.listMessages(state.activeConvoId).then(msgs=>{
    const m = msgs.find(x=>x.msgId===msgId);
    if(!m || !m.content || !m.content.dataUrl) return;
    const audio = new Audio(m.content.dataUrl);
    currentVoiceAudio = audio;
    currentVoicePlayingId = msgId;
    document.getElementById('wave-'+msgId)?.classList.add('playing');
    audio.onended = ()=> stopVoicePlayback();
    audio.play().catch(()=> stopVoicePlayback());
  });
}
function stopVoicePlayback(){
  if(currentVoicePlayingId) document.getElementById('wave-'+currentVoicePlayingId)?.classList.remove('playing');
  currentVoiceAudio = null;
  currentVoicePlayingId = null;
}

/* ================= 端到端加密 =================
   1:1：用对方的公钥 + 我的私钥做 ECDH，派生出一把只有我们俩能算出来的
        AES-256 密钥，缓存起来避免每条消息重新算一次。
   群聊：见 inviteMembersToGroup 里的"群密钥"方案。
   CF（不管是实时中转还是离线队列存储）全程只看到密文——下面这几个函数
   之外的发送/接收逻辑不应该再直接把 content 明文塞进 payload 里发出去。
================================================= */

const dmKeyCache = {}; // 对方userId -> 已经派生好的 AES-GCM CryptoKey，省得每条消息都重新算

/* 经CF中转的消息送达确认。P2P直连那条ACK通道（P2P模块内部的pendingAcks）
   完全走数据通道，跟这里无关——这是专门给"没有P2P直连、纯靠CF中转"这条
   路径补的一套确认机制：以前中转发出去就直接算数，导致对方明明收到了，
   这边却一直显示"未送达"。现在收到chat消息的一方，如果是经中转（不是经
   P2P数据通道）收到的，会把ack经同一个房间广播回去，见 handleIncoming。
   同一套机制也用于加好友请求/同意这类一次性协议消息（reqId），因为它们
   同样必须"真的等对方确认收到"，而不是发出去就当数——见
   sendFriendProtocolMsg。 */
const pendingRelayAcks = new Map(); // msgId 或 reqId -> resolve函数

// 经CF中转发一条消息，并且真的等对方确认收到；等不到（对方大概率真的
// 不在线/没连着这个房间）就返回false，调用方据此决定要不要标"未送达"/要不要重试
function sendViaRelayAndWaitAck(roomId, payload, timeoutMs=4000){
  BubbleComm.send(roomId, payload);
  const id = payload.msgId || payload.reqId;
  if(!id) return Promise.resolve(true);
  return new Promise(resolve=>{
    const timer = setTimeout(()=>{ pendingRelayAcks.delete(id); resolve(false); }, timeoutMs);
    pendingRelayAcks.set(id, ()=>{ clearTimeout(timer); resolve(true); });
  });
}

// 拿一个人的公钥：优先本地好友记录，其次内存缓存，最后才去 CF 查（比如对方还不是好友）
async function resolvePublicKey(uid){
  const f = state.friends.find(x=>x.userId===uid);
  if(f && f.publicKeyB64) return f.publicKeyB64;
  if(state.profileCache[uid]?.publicKeyB64) return state.profileCache[uid].publicKeyB64;
  const p = await BubbleCF.getProfile(uid);
  if(p){ state.profileCache[uid] = p; return p.publicKeyB64; }
  return null;
}

// 拿（或派生）我和某个人之间的共享密钥；对方公钥暂时查不到就返回 null（调用方要处理这种情况，不能明文兜底发送）
async function getDmKey(peerUid){
  if(dmKeyCache[peerUid]) return dmKeyCache[peerUid];
  const peerPubB64 = await resolvePublicKey(peerUid);
  if(!peerPubB64) return null;
  const peerPubKey = await BubbleCrypto.importPeerPublicKey(peerPubB64);
  const aesKey = await BubbleCrypto.deriveSharedKey(state.me.privateKey, peerPubKey);
  dmKeyCache[peerUid] = aesKey;
  return aesKey;
}

// 把一个 JS 对象加密成信封 {iv, ciphertext}，发给指定的人；失败（比如对方公钥查不到）返回 null
async function encryptForPeer(peerUid, obj){
  const key = await getDmKey(peerUid);
  if(!key) return null;
  return BubbleCrypto.encryptText(key, JSON.stringify(obj));
}
// 解密来自指定的人的信封，还原成 JS 对象；解不开（信封坏了/密钥不对）返回 null，调用方应该直接丢弃这条消息，不能当成明文显示
async function decryptFromPeer(peerUid, envelope){
  const key = await getDmKey(peerUid);
  if(!key) return null;
  try{ return JSON.parse(await BubbleCrypto.decryptText(key, envelope)); }
  catch(e){ console.warn('[crypto] decrypt failed', e); return null; }
}

/* ================================================================
   ==================  P2P 直连模块（WebRTC）开始  ==================
   ================================================================
   目的：两边都在线的时候，消息（以及以后的语音/视频通话）直接走
   WebRTC 点对点连接，不再经过 CF；只有直连建立不起来——比如一方根本
   不在线、或者 NAT/防火墙穿不透——才退回到前面已经写好的"CF 信令中转
   + 离线队列"那一整套（不受这个模块影响，作为兜底继续保留）。

   握手过程（offer/answer/ICE candidate）本身还是要经过 CF 转发——这部
   分数据量很小，只是几段文本，算不上什么额外成本；真正占地方、占连接
   数的聊天内容，一旦直连打通了就完全不走 CF 了。握手消息也是加密的，
   复用前面 encryptForPeer/decryptFromPeer 那套，避免把双方的网络信息
   （ICE candidate 里含有 IP）明文暴露给中转服务器。

   群人数上限是10人（GROUP_MAX_MEMBERS），所以群聊也做了直连——发消息的人
   给当前在线的群成员分别建一条直连、直接广播过去（见 sendMessage 里群聊
   那一段），不是给整个群建一条"共享"连接，是给每个人各自的一对一直连。
   要是群人数上限以后改大了，这个mesh方案会不划算（N人两两互联是N²增长），
   到时候要重新评估。

   连接的发起用了 WebRTC 官方推荐的"perfect negotiation（完美协商）"模
   式来处理"双方同时发起连接"这种冲突——两边各自算出一个 polite（礼让）
   / impolite（强势）角色（比较 UserID 大小，算法双方结果一定相反），
   冲突时礼让方会主动放弃自己发的 offer、接受对方的，从而避免两边卡死。
   ================================================================ */
const P2P = (() => {
  const peers = {}; // 对方userId -> {pc, channel, polite, makingOffer, ignoreOffer, channelCreated, createdAt, lastActivityTs, heartbeatMissed}
  const pendingPeers = {}; // 对方userId -> 正在创建中的 Promise，防止两个并发调用建出两个连接

  /* ---------- 可靠传输层：ACK + 去重 + 心跳 ----------
     WebRTC 的 DataChannel 本身是可靠有序的（SCTP），但"通道显示还开着"不等于
     "对方真的收到了"——尤其是手机后台、WebView 场景下，底层 socket 可能已经
     被系统冻结/销毁，channel.readyState 却还没来得及变成 closed。所以不能只
     信 channel.send() 没抛异常就算送达，必须由业务层自己确认：每条消息带
     msgId，对方收到后原样回一个 ACK，发送方等 2.5 秒收不到 ACK 就判定这条
     通道已经失效——销毁重建，同时这条消息走 CF 兜底，不会丢。 */
  const pendingAcks = new Map();   // msgId -> resolve函数，等ACK用
  const pendingPings = new Map();  // pingId -> resolve函数，心跳用
  const recentMsgIds = new Map();  // msgId -> 收到时间，去重用（限量的环形缓存，见 rememberMsgId）
  const ACK_TIMEOUT_MS = 2500;         // ACK等待超时——太短容易被网络抖动误判，太长用户会感觉卡顿，2-3秒是折中
  const HEARTBEAT_IDLE_MS = 35*1000;   // 空闲超过这么久没有业务往来，才需要发心跳去探活
  const HEARTBEAT_TIMEOUT_MS = 3000;   // 心跳等回执的超时
  const RECENT_MSGID_CAP = 500;        // 去重缓存最多记这么多条，超了淘汰最老的，防止内存无限增长

  function rememberMsgId(msgId){
    recentMsgIds.set(msgId, Date.now());
    if(recentMsgIds.size > RECENT_MSGID_CAP){
      const oldestKey = recentMsgIds.keys().next().value; // Map 按插入顺序迭代，第一个就是最老的
      recentMsgIds.delete(oldestKey);
    }
  }

  // 语音/视频通话模块是单独一块代码（搜索"语音视频通话模块"），不想让它和这里的连接管理逻辑
  // 耦合在一起，所以通话相关的信令（call-invite/accept/decline/end）和收到的音视频轨道，
  // 都通过下面这两个"外部挂钩"转交出去，P2P 模块本身完全不关心通话的业务逻辑
  let onCustomSignal = null; // 收到 t 不是 'sdp'/'ice' 的信令时调用，比如通话邀请
  let onRemoteTrack = null;  // 收到对方的音视频轨道时调用
  let onChannelOpen = null;  // 跟某个人的数据通道刚打通时调用——用来触发"未送达消息补发"（见 resendUndeliveredTo）
  function setCustomSignalHandler(fn){ onCustomSignal = fn; }
  function setRemoteTrackHandler(fn){ onRemoteTrack = fn; }
  function setChannelOpenHandler(fn){ onChannelOpen = fn; }

  // 谁是"礼让方"：双方各自算出来的结果一定相反，用来在双方同时发起连接时决定谁让步
  function isPolite(peerUid){ return state.me.userId < peerUid; }

  // 拿 ICE 服务器列表：Cloudflare 的 STUN 免费无限量直接用；TURN 是按需申请的短期凭证，
  // 没配置的话（getTurnCredentials 返回 null）就只用 STUN，多数情况下也够用
  async function getIceServers(){
    const servers = [{urls:'stun:stun.cloudflare.com:3478'}];
    const turnServers = await BubbleCF.getTurnCredentials();
    if(turnServers) servers.push(...turnServers);
    return servers;
  }

  // 把一条信令消息（offer/answer/ice/通话控制）加密后经由对方的"个人信箱房间"转发给他，
  // 和加好友通知、群邀请走的是同一条通道
  async function sendSignal(peerUid, signal){
    const envelope = await encryptForPeer(peerUid, signal);
    if(!envelope) return; // 对方公钥还查不到——这轮直连先放弃，消息本身仍然会走CF兜底送达
    BubbleComm.send(peerUid, {kind:'rtc_sig_env', from: state.me.userId, envelope});
  }

  // 拿到（或新建）和某个人之间的 RTCPeerConnection，只建连接本身，不在这里建数据通道
  // ——数据通道由 connect() 按需创建，这样无论谁先打开聊天窗口都能发起连接
  async function ensurePeer(peerUid){
    if(peers[peerUid]) return peers[peerUid];
    if(pendingPeers[peerUid]) return pendingPeers[peerUid]; // 已经有一个在建了，等它，不要重复建
    const creating = (async ()=>{
      if(typeof RTCPeerConnection === 'undefined'){ console.warn('[P2P] 当前浏览器不支持WebRTC'); return null; }
      const iceServers = await getIceServers();
      const hasTurn = iceServers.length > 1; // 数组第一个永远是免费STUN，超过1个说明TURN凭证真的拿到了
      // "中转优先"模式下强制只用TURN候选（跳过尝试直连），见 getConnectionMode
      // 的说明——聊天数据通道和语音/视频通话共用同一个RTCPeerConnection，
      // 这里定下的策略同时影响两者。没有真的配置TURN的话没法用这个模式
      // （relay策略下完全没有candidate可用，连接会直接失败），自动退回
      // 直连优先，不会把连接直接搞死。
      const iceTransportPolicy = (getConnectionMode()==='relay' && hasTurn) ? 'relay' : 'all';
      const pc = new RTCPeerConnection({iceServers, iceTransportPolicy});
      const entry = { pc, channel:null, polite: isPolite(peerUid), makingOffer:false, ignoreOffer:false, channelCreated:false,
        createdAt: Date.now(), lastActivityTs: Date.now(), heartbeatMissed:0, heartbeatTimer:null };
      peers[peerUid] = entry;

      // 一旦发现新的本地 ICE candidate，立刻通过信令通道告诉对方
      pc.onicecandidate = (ev)=>{ if(ev.candidate) sendSignal(peerUid, {t:'ice', candidate: ev.candidate}); };

      // 需要交换 SDP 的时候（比如刚创建了数据通道）浏览器会自动触发这个事件
      pc.onnegotiationneeded = async ()=>{
        try{
          entry.makingOffer = true;
          await pc.setLocalDescription();
          sendSignal(peerUid, {t:'sdp', description: pc.localDescription});
        }catch(e){ console.warn('[P2P] 协商失败', e); }
        finally{ entry.makingOffer = false; }
      };

      // 对方创建数据通道时，我这边会收到这个事件（我如果是"接收方"就是这么拿到通道的）
      pc.ondatachannel = (ev)=> attachChannel(peerUid, ev.channel);

      // 通话时对方的音频/视频轨道从这里进来，转交给通话模块处理（P2P模块本身不播放媒体流）
      pc.ontrack = (ev)=> onRemoteTrack?.(peerUid, ev);

      pc.onconnectionstatechange = ()=>{
        updateP2PBadge(peerUid);
        if(pc.connectionState==='failed' || pc.connectionState==='closed' || pc.connectionState==='disconnected'){
          cleanupPeer(peerUid);
        }
      };
      startHeartbeat(peerUid);
      return entry;
    })();
    pendingPeers[peerUid] = creating;
    const result = await creating;
    delete pendingPeers[peerUid];
    return result;
  }

  // 把一个数据通道（不管是我自己建的还是对方建的）接上收发逻辑
  function attachChannel(peerUid, channel){
    const entry = peers[peerUid];
    if(!entry) return;
    entry.channel = channel;
    channel.onopen = ()=>{
      console.log('[P2P] 与', peerUid, '的直连数据通道已打开，之后的消息会优先走直连');
      updateP2PBadge(peerUid);
      onChannelOpen?.(peerUid); // 通道刚打通——去补发本地攒着的"未送达"消息
    };
    channel.onclose = ()=>{ if(entry.channel===channel) entry.channel = null; updateP2PBadge(peerUid); };
    channel.onerror = (e)=> console.warn('[P2P] 数据通道出错', e);
    channel.onmessage = (ev)=>{
      entry.lastActivityTs = Date.now();
      let payload;
      try{ payload = JSON.parse(ev.data); }catch(e){ return; }

      // 心跳/ACK 是控制消息，不进业务逻辑
      if(payload.kind === 'p2p-ack'){
        const resolve = pendingAcks.get(payload.msgId);
        if(resolve){ pendingAcks.delete(payload.msgId); resolve(); }
        return;
      }
      if(payload.kind === 'p2p-ping'){
        try{ channel.send(JSON.stringify({kind:'p2p-pong', pingId:payload.pingId})); }catch(e){}
        return;
      }
      if(payload.kind === 'p2p-pong'){
        const resolve = pendingPings.get(payload.pingId);
        if(resolve){ pendingPings.delete(payload.pingId); resolve(); }
        return;
      }

      // 普通业务消息：不管是不是重复的，先回ACK（对方可能是因为ACK丢了才重发，
      // 重发的消息也得让它安心，不然会一直重试）
      if(payload.msgId){
        try{ channel.send(JSON.stringify({kind:'p2p-ack', msgId:payload.msgId})); }catch(e){}
        if(recentMsgIds.has(payload.msgId)) return; // 已经处理过，丢弃，避免重复入库/重复通知
        rememberMsgId(payload.msgId);
      }
      // 直连收到的数据和走CF中转收到的数据是同一套加密信封格式，直接复用 handleIncoming 处理，
      // 不用重新写一遍消息入库、未读计数那些逻辑；第三个参数true表示这是经P2P
      // 数据通道收到的——handleIncoming 据此知道不用再经CF回一份"中转ack"
      // （P2P这条路径的确认走的是上面已经发出去的 p2p-ack，走的是另一条通道）
      handleIncoming(peerUid, payload, true);
    };
  }

  // 主动发起直连：如果已经在连了就什么都不做（避免重复创建数据通道）
  async function connect(peerUid){
    const entry = await ensurePeer(peerUid);
    if(!entry || entry.channelCreated) return;
    entry.channelCreated = true;
    attachChannel(peerUid, entry.pc.createDataChannel('chat')); // 创建数据通道会自动触发 onnegotiationneeded，从而发出 offer
  }

  // 收到对方经CF信令通道转发来的 offer/answer/ice，这里统一处理
  // "完美协商"的核心就在这几行：礼让方遇到冲突会主动回退自己的 offer，接受对方的
  async function handleSignal(peerUid, signal){
    if(signal.t === 'reset'){
      // 对方判定连接失效、正在重建一条全新的PC——我这边如果还留着旧PC（尤其是
      // 通话用过、带着音视频m-line历史的），必须一并清掉，不然对方紧接着发过来
      // 的全新offer（只有数据通道这一条m-line）会跟我这边的历史对不上号，
      // 引发 "order of m-lines...doesn't match" 那个报错。是否重建交给后续
      // 真正要用的地方（发消息/发起通话）按需 connect()，这里只负责清干净。
      cleanupPeer(peerUid);
      return;
    }
    const entry = await ensurePeer(peerUid);
    if(!entry) return;
    const pc = entry.pc;
    if(signal.t === 'sdp'){
      const desc = signal.description;
      const offerCollision = desc.type==='offer' && (entry.makingOffer || pc.signalingState!=='stable');
      entry.ignoreOffer = !entry.polite && offerCollision;
      if(entry.ignoreOffer) return; // 强势方直接无视冲突的offer，等对方让步
      await pc.setRemoteDescription(desc);
      if(desc.type==='offer'){
        await pc.setLocalDescription();
        sendSignal(peerUid, {t:'sdp', description: pc.localDescription});
      }
    } else if(signal.t === 'ice'){
      try{ await pc.addIceCandidate(signal.candidate); }
      catch(e){ if(!entry.ignoreOffer) console.warn('[P2P] 添加ICE候选失败', e); }
    } else {
      // 不是SDP/ICE——交给外部挂钩处理（通话邀请/接受/拒绝/挂断这些）
      onCustomSignal?.(peerUid, signal);
    }
  }

  // 数据通道是否已经打通、可以直接发消息了（注意：这只是"看起来开着"，真正
  // 可靠与否要靠 sendReliable 的 ACK 结果，见下面）
  function isChannelOpen(peerUid){
    const entry = peers[peerUid];
    return !!(entry && entry.channel && entry.channel.readyState==='open');
  }

  // 不等确认、发出去就算数的旧接口——现在只给通话信令这种没有 msgId、
  // 不需要可靠保证的场景用；聊天消息一律走下面的 sendReliable
  function sendViaChannel(peerUid, payload){
    if(!isChannelOpen(peerUid)) return false;
    try{ peers[peerUid].channel.send(JSON.stringify(payload)); peers[peerUid].lastActivityTs = Date.now(); return true; }
    catch(e){ console.warn('[P2P] 直连发送失败', e); return false; }
  }

  /* 可靠发送：真正等对方ACK确认才算成功。
     - 通道没打开：直接返回false，调用方走CF兜底，不用等。
     - 发出去了但2.5秒没等到ACK：判定隧道失效——销毁、发起重建（不阻塞这次
       调用），返回false，调用方一样走CF兜底，这条消息不会丢。
     - 没有msgId的payload（通话信令）：发出去不抛异常就算数，不走ACK流程。 */
  function sendReliable(peerUid, payload){
    if(!isChannelOpen(peerUid)) return Promise.resolve(false);
    const entry = peers[peerUid];
    try{ entry.channel.send(JSON.stringify(payload)); entry.lastActivityTs = Date.now(); }
    catch(e){ console.warn('[P2P] 直连发送失败', e); return Promise.resolve(false); }
    if(!payload.msgId) return Promise.resolve(true);
    return new Promise(resolve=>{
      const timer = setTimeout(()=>{
        pendingAcks.delete(payload.msgId);
        console.log('[P2P] 与', peerUid, '的ACK超时，判定隧道失效，销毁重建');
        resetPeerConnection(peerUid, true); // 异步重建，不等它，这次消息已经决定走CF兜底了
        resolve(false);
      }, ACK_TIMEOUT_MS);
      pendingAcks.set(payload.msgId, ()=>{ clearTimeout(timer); resolve(true); });
    });
  }

  // 心跳：只有真的空闲太久（没有任何业务消息/ACK往来）才发探测包，避免额外流量
  function startHeartbeat(peerUid){
    const entry = peers[peerUid];
    if(!entry) return;
    entry.heartbeatTimer = setInterval(async ()=>{
      const cur = peers[peerUid];
      if(!cur || !isChannelOpen(peerUid)){ clearInterval(entry.heartbeatTimer); return; }
      if(Date.now() - cur.lastActivityTs < HEARTBEAT_IDLE_MS) return; // 最近有正常往来，不用心跳
      const pingId = 'hb_'+crypto.randomUUID();
      const ok = await new Promise(resolve=>{
        try{ cur.channel.send(JSON.stringify({kind:'p2p-ping', pingId})); }
        catch(e){ resolve(false); return; }
        const timer = setTimeout(()=>{ pendingPings.delete(pingId); resolve(false); }, HEARTBEAT_TIMEOUT_MS);
        pendingPings.set(pingId, ()=>{ clearTimeout(timer); resolve(true); });
      });
      if(!peers[peerUid]) return; // 等回执的这段时间里连接可能已经被别的路径清掉了
      if(ok){ peers[peerUid].heartbeatMissed = 0; peers[peerUid].lastActivityTs = Date.now(); }
      else{
        peers[peerUid].heartbeatMissed++;
        console.log('[P2P] 与', peerUid, '心跳未回执，第', peers[peerUid].heartbeatMissed, '次');
        if(peers[peerUid].heartbeatMissed >= 2){ resetPeerConnection(peerUid, true); }
      }
    }, HEARTBEAT_IDLE_MS);
  }

  let onPeerClosed = null; // 底层连接整个断掉时通知一声，通话模块好把还开着的通话悬浮窗收掉
  function setPeerClosedHandler(fn){ onPeerClosed = fn; }

  function cleanupPeer(peerUid){
    const entry = peers[peerUid];
    if(!entry) return;
    if(entry.heartbeatTimer) clearInterval(entry.heartbeatTimer);
    try{ entry.channel?.close(); entry.pc.close(); }catch(e){}
    delete peers[peerUid];
    onPeerClosed?.(peerUid);
  }

  // 之前所有"判定隧道失效，销毁重建"的地方都是只 cleanupPeer(peerUid) 自己这一侧，
  // 然后 connect(peerUid) 重新建一条全新的 RTCPeerConnection——但对方那一侧的旧
  // RTCPeerConnection 完全不知情，还留着之前协商出来的 m-line 历史（比如通过话之后
  // 音视频轨道对应的 m-line，哪怕已经 inactive 也还占着位置）。等我这边全新的PC发出
  // 只有数据通道这一条 m-line 的offer过去，跟对方那条"记忆"里3条m-line的历史一对，
  // 顺序/数量对不上，就是文档顶部那个报错的真正根源：
  //   Failed to set remote offer sdp: The order of m-lines in subsequent offer
  //   doesn't match order from previous offer/answer.
  // 修复思路：重建前，先经CF信令通道（不依赖这条已经判定失效的P2P直连本身）通知
  // 对方"我要重来了"，对方收到后把自己那条旧PC也一并清掉，双方从同一个空白状态
  // 重新协商，就不会有历史m-line对不上的问题。rebuild=false 用于只是资源回收
  // （空闲/存活过久/卡住）、不必立刻重连的场景，通知一声、清掉即可，不用马上重建。
  function resetPeerConnection(peerUid, rebuild){
    sendSignal(peerUid, {t:'reset'});
    cleanupPeer(peerUid);
    if(rebuild) connect(peerUid);
  }

  const IDLE_TIMEOUT_MS = 5*60*1000;   // 软超时——"链路缓存5分钟"：连续空闲超过这么久就主动断开，不占着资源，下次要用再重连
  const HARD_MAX_MS = 15*60*1000;      // 硬超时——不管是否一直有业务往来，15分钟无条件强制断开重建，
                                        // 防止进程休眠、NAT静默失效之类的情况下连接对象一直占着资源不释放
  const STUCK_TIMEOUT_MS = 12*1000;    // 连接卡在 new/connecting 超过这么久，大概率是打不通了，清掉好让后续重试生效

  // 定期体检：不健康的连接（卡住的、空闲太久的、或者活过头的）主动清掉。光靠浏览器
  // 自己的 onconnectionstatechange('failed') 不够——两边一直没能交换上ICE候选时，
  // 连接可能长期停留在 connecting/new，根本不会触发 failed。
  function sweepConnections(){
    const now = Date.now();
    Object.keys(peers).forEach(peerUid=>{
      const entry = peers[peerUid];
      if(!entry) return;
      if(now - entry.createdAt > HARD_MAX_MS){
        console.log('[P2P] 与', peerUid, '的连接已存活超过15分钟，强制回收（硬超时，与是否空闲无关）');
        resetPeerConnection(peerUid, false);
        return;
      }
      const st = entry.pc.connectionState;
      if(st==='connected' && entry.channel?.readyState==='open'){
        if(now - entry.lastActivityTs > IDLE_TIMEOUT_MS){
          console.log('[P2P] 与', peerUid, '的直连空闲超过5分钟，主动断开释放资源');
          resetPeerConnection(peerUid, false);
        }
      } else if(st==='connecting' || st==='new'){
        if(now - entry.createdAt > STUCK_TIMEOUT_MS){
          console.log('[P2P] 与', peerUid, '的连接建立卡住了，清掉，等待下次重试');
          resetPeerConnection(peerUid, false);
        }
      }
    });
  }

  // App从后台切回前台时调用：不相信内存里缓存的"通道还开着"这个状态（安卓
  // WebView打包成APK之后，退后台会被系统冻结/销毁底层socket，但JS对象可能
  // 还残留在内存里，channel.readyState 也可能还没来得及变成closed），主动发
  // 一次心跳验证，验证不通过就强制清理、交给后续的连接清扫重新建立。
  function verifyConnectionsOnForeground(){
    Object.keys(peers).forEach(async peerUid=>{
      if(!isChannelOpen(peerUid)) return;
      const entry = peers[peerUid];
      const pingId = 'hb_'+crypto.randomUUID();
      const ok = await new Promise(resolve=>{
        try{ entry.channel.send(JSON.stringify({kind:'p2p-ping', pingId})); }
        catch(e){ resolve(false); return; }
        const timer = setTimeout(()=>{ pendingPings.delete(pingId); resolve(false); }, HEARTBEAT_TIMEOUT_MS);
        pendingPings.set(pingId, ()=>{ clearTimeout(timer); resolve(true); });
      });
      if(!ok && peers[peerUid]){
        console.log('[P2P] 前台校验：与', peerUid, '的残留连接已经失效，清理并重连');
        resetPeerConnection(peerUid, true);
      }
    });
  }

  // 主动尝试建立直连，最多等这么久——通话功能用这个：先试着连，连上了才发
  // 通话邀请，连不上才提示用户，而不是一上来看到没连就直接拒绝
  function waitForConnection(peerUid, timeoutMs){
    if(isChannelOpen(peerUid)) return Promise.resolve(true);
    connect(peerUid);
    return new Promise(resolve=>{
      const startTs = Date.now();
      const check = ()=>{
        if(isChannelOpen(peerUid)){ resolve(true); return; }
        if(Date.now()-startTs >= timeoutMs){ resolve(false); return; }
        setTimeout(check, 300);
      };
      check();
    });
  }

  // 退出登录时把所有直连都断掉，避免残留连接
  function disconnectAll(){
    Object.keys(peers).forEach(cleanupPeer);
  }

  // 通话模块要用到的：拿到某个人现成的 RTCPeerConnection（没建好直连就是 null——
  // 通话强制要求已经有直连，见下面 Call.start 里的检查）
  function getPeerConnection(peerUid){
    const entry = peers[peerUid];
    return entry ? entry.pc : null;
  }

  return { connect, handleSignal, isChannelOpen, sendViaChannel, sendReliable, disconnectAll, getIceServers,
    sendSignal, getPeerConnection, setCustomSignalHandler, setRemoteTrackHandler, setPeerClosedHandler,
    setChannelOpenHandler, sweepConnections, verifyConnectionsOnForeground, waitForConnection };
})();
/* ================================================================
   ==================  P2P 直连模块（WebRTC）结束  ==================
   ================================================================ */


/* ================================================================
   ==================  语音/视频通话模块 开始  ======================
   ================================================================
   建立在上面的 P2P 模块之上——复用同一条 RTCPeerConnection（不重新建一条），
   通话时只是往这条已经建好的连接上加音频/视频轨道，加轨道会自动触发重新
   协商（P2P模块里的 onnegotiationneeded 已经处理好了，这里不用再管）。

   硬性要求（对应"如何确认走的是P2P、没连上就不能打电话"这个问题）：
   发起通话前必须先用 P2P.isChannelOpen() 确认数据通道已经真正打通，没打通
   直接拒绝发起通话、绝不退化成经CF中转——CF的Worker/KV/DO从设计上就不是
   拿来转发音视频流的，音视频数据量太大，硬要转会立刻把免费额度吃穿。
   如果直连一直建不起来（比如双方都在严格NAT/防火墙后面、STUN不够用），
   唯一的补救是配置 Cloudflare TURN（P2P模块的 getIceServers 已经在用了），
   TURN 中继的音视频流走的是 Cloudflare Realtime 那个专门按流量计费的服务，
   跟 Workers/KV 的免费额度是两码事，不会挤占别的功能的配额。

   通话控制信令（邀请/接受/拒绝/挂断）复用 P2P 模块暴露出来的
   sendSignal/setCustomSignalHandler，跟 offer/answer/ICE 走的是同一条
   加密信令通道，不用另外再建一套。
   ================================================================ */
/* ================================================================
   ==================  提示音 + 通话记录 辅助函数  ==================
   ================================================================
   提示音用 Web Audio API 现场合成几个简单的"哔"声，不需要额外的音频文件资源。
   通话记录复用聊天消息机制（type:'call'），呼出/来电时先插入一条"响铃中"的
   占位消息，接通/拒绝/未接/挂断的时候原地更新同一条（同 msgId 覆盖），
   和微信"语音通话 01:23"/"已取消"这种效果一样。
   ================================================================ */

// 设置里的"消息/通话提示音"开关，默认开——只有明确设成 false 才是关
function soundEnabled(){ return state.me?.soundEnabled !== false; }

function ensureAudioCtx(){
  if(!callAudioCtx) callAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(callAudioCtx.state === 'suspended') callAudioCtx.resume().catch(()=>{});
  return callAudioCtx;
}
// 合成一声"哔"：freq音高，durationMs时长，delaySec相对现在延迟多久播放
function beep(freq, durationMs, delaySec=0, vol=0.15){
  if(!soundEnabled()) return;
  try{
    const ctx = ensureAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.value = vol;
    osc.connect(gain); gain.connect(ctx.destination);
    const start = ctx.currentTime + delaySec;
    osc.start(start);
    osc.stop(start + durationMs/1000);
  }catch(e){ /* 音频上下文在某些浏览器需要用户先交互过才能用，静默失败就好，不影响通话本身 */ }
}
function stopRingLoop(){
  if(callRingLoopId){ clearInterval(callRingLoopId); callRingLoopId = null; }
}
// 通话相关的提示音：incoming=来电铃声（循环，直到接听/挂断），outgoing=去电等待音（循环），
// connect=接通瞬间的提示，end=结束/拒绝/未接时的提示
function playCallSound(kind){
  if(kind==='incoming'){
    stopRingLoop();
    const ring = ()=>{ beep(740,320,0); beep(950,320,0.35); };
    ring();
    callRingLoopId = setInterval(ring, 1700);
  } else if(kind==='outgoing'){
    stopRingLoop();
    const ring = ()=> beep(480,650,0);
    ring();
    callRingLoopId = setInterval(ring, 2000);
  } else if(kind==='connect'){
    stopRingLoop();
    beep(880,140,0); beep(1160,140,0.15);
  } else if(kind==='end'){
    stopRingLoop();
    beep(380,220,0);
  }
}
// 收到新消息时的短提示音（跟未读角标同一个触发条件——当前没在看这个会话才响）
// function playMessageSound(){ beep(700,110,0,0.12); beep(880, 80, 0, 0.15);}
function playMessageSound(){
  // beep(880,70,40,0.15);
  // beep(1100,70,0,0.15);
  beep(1200,150,0,0.2);
}

// 通话记录preview文案（消息列表最后一条预览、以及聊天气泡里显示的文字）
function callPreviewText(c){
  const kind = c.video ? (currentLang==='zh'?'视频通话':'Video call') : (currentLang==='zh'?'语音通话':'Voice call');
  if(c.status==='ended') return `${kind} ${formatCallDuration(c.duration||0)}`;
  if(c.status==='missed') return currentLang==='zh'?`${kind}（未接听）`:`${kind} (missed)`;
  if(c.status==='declined') return currentLang==='zh'?`${kind}（已拒绝）`:`${kind} (declined)`;
  if(c.status==='busy') return currentLang==='zh'?`${kind}（对方忙线）`:`${kind} (busy)`;
  if(c.status==='cancelled') return currentLang==='zh'?`${kind}（已取消）`:`${kind} (cancelled)`;
  return kind; // 'ringing'——还在响的时候
}
function formatCallDuration(seconds){
  const s = Math.max(0, Math.floor(seconds));
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

// 插入一条"通话记录"占位消息（响铃中），返回 msgId 给 Call 模块存起来，方便后面原地更新
async function logCallMessage(peerUid, video, direction, status){
  const convo = await ensureConvoWithFriend(peerUid);
  const msgId = 'call_'+crypto.randomUUID();
  const msg = { msgId, convId: convo.id, from: direction==='outgoing'?state.me.userId:peerUid, type:'call',
    content:{video, direction, status: status||'ringing', duration:0}, createdAt: Date.now(), expiresAt: null };
  await BubbleDB.addMessage(msg);
  convo.updatedAt = Date.now();
  convo.lastPreview = callPreviewText(msg.content);
  await BubbleDB.upsertConvo(convo);
  if(state.activeConvoId===convo.id) await renderMain(); else renderAll();
  return msgId;
}
// 原地更新那条通话记录消息的最终状态（接通时长/未接/拒绝/取消/忙线）
async function updateCallMessage(msgId, convId, patch){
  if(!msgId || !convId) return;
  const msg = await BubbleDB.getMessage(msgId);
  if(!msg) return;
  Object.assign(msg.content, patch);
  await BubbleDB.addMessage(msg); // 同 msgId，put 直接覆盖，不会产生第二条
  const convo = state.convos.find(c=>c.id===convId);
  if(convo){ convo.lastPreview = callPreviewText(msg.content); convo.updatedAt = Date.now(); await BubbleDB.upsertConvo(convo); }
  if(state.activeConvoId===convId) await renderMain(); else renderAll();
}


const Call = (() => {
  // 当前通话状态；同一时间只允许一通电话。null 表示没有通话。
  // status: 'calling'（我发起，等对方接）| 'incoming'（对方发起，等我接）| 'active'（通话中）
  let callState = null;
  let remoteStream = null; // 对方的音视频流，ontrack 事件里塞进来

  // 发起一通通话——语音传 video=false，视频传 video=true
  async function start(peerUid, video){
    if(callState){ showToast(currentLang==='zh'?'当前已有通话，请先挂断':'Already in a call — hang up first'); return; }
    // 通话权限规则（见 getConnectionMode/isRelayCallsAllowed 顶部的说明）：
    //   直连模式：无条件要求真实P2P直连打通，没有任何退化路径。
    //   中转模式 + isRelayCallsAllowed()=true：不要求真实P2P，走TURN中转也能通话。
    //   中转模式 + isRelayCallsAllowed()=false：跟直连模式一样，仍然要求真实
    //     P2P直连打通——这是有意留出的口子，以后中转优先做成会员功能时，
    //     "中转模式下能不能打通话"可以单独再收一道权限，不跟"能不能发消息"
    //     绑在一起。
    const relayCallsOk = getConnectionMode()==='relay' && isRelayCallsAllowed();
    if(!relayCallsOk){
      // 不是"没连上就直接拒绝"，而是先主动试一下（最多等6秒），连上了才发
      // 通话邀请，连不上才提示用户
      if(!P2P.isChannelOpen(peerUid)){
        showToast(currentLang==='zh'?'正在建立直连…':'Establishing direct connection…');
        const ok = await P2P.waitForConnection(peerUid, 6000);
        if(!ok){
          showToast(currentLang==='zh'?'尚未建立直连，暂时无法通话':"No direct connection yet — can't start a call");
          return;
        }
      }
    } else {
      await P2P.connect(peerUid); // 保证底层连接已经在建立/存在，不强求这一刻就已经完全连通
    }
    const pc = P2P.getPeerConnection(peerUid);
    if(!pc){ showToast(currentLang==='zh'?'连接异常，请重试':'Connection error — try again'); return; }
    let localStream;
    try{ localStream = await navigator.mediaDevices.getUserMedia({audio:true, video: video?{facingMode:currentCameraFacing}:false}); }
    catch(e){ showToast(currentLang==='zh'?'无法获取摄像头/麦克风权限':'Camera/microphone permission denied'); return; }
    const convo = await ensureConvoWithFriend(peerUid);
    callState = { peerUid, video, status:'calling', direction:'outgoing', convId:convo.id, callMsgId:null,
      localStream, pc, senders:[], startedAt:null, timerId:null, controlsHidden:false, mainIsRemote:true };
    localStream.getTracks().forEach(track=> callState.senders.push(pc.addTrack(track, localStream)));
    P2P.sendSignal(peerUid, {t:'call-invite', video});
    playCallSound('outgoing');
    callState.callMsgId = await logCallMessage(peerUid, video, 'outgoing', 'ringing');
    renderCallOverlay();
  }

  // 接听来电
  async function accept(){
    if(!callState || callState.status!=='incoming') return;
    let localStream;
    try{ localStream = await navigator.mediaDevices.getUserMedia({audio:true, video: callState.video?{facingMode:currentCameraFacing}:false}); }
    catch(e){
      showToast(currentLang==='zh'?'无法获取摄像头/麦克风权限':'Camera/microphone permission denied');
      decline();
      return;
    }
    callState.localStream = localStream;
    localStream.getTracks().forEach(track=> callState.senders.push(callState.pc.addTrack(track, localStream)));
    callState.status = 'active';
    callState.startedAt = Date.now();
    startTimer();
    playCallSound('connect');
    P2P.sendSignal(callState.peerUid, {t:'call-accept'});
    renderCallOverlay();
    if(callState.video) setControlsHidden(false); // 先显示几秒，再按上面的自动隐藏定时器收起去
  }

  // 拒接来电
  function decline(){
    if(!callState) return;
    P2P.sendSignal(callState.peerUid, {t:'call-decline'});
    teardown('declined');
  }

  // 挂断（不管是通话中还是我自己正在呼叫对方，都能用这个挂断）
  function hangup(){
    if(!callState) return;
    P2P.sendSignal(callState.peerUid, {t:'call-end'});
    teardown(callState.status==='calling' ? 'cancelled' : undefined); // undefined = 交给teardown自动判断（通话中→已结束）
  }

  // 切换前置/后置摄像头——用 replaceTrack，不用整个重新协商连接，切换更快也更不容易卡。
  // 之前在有些手机上切不过去，两个原因：
  //   1) 旧摄像头轨道没先停掉就去开新的——很多手机的摄像头硬件/浏览器实现
  //      不允许同时有两路摄像头采集在跑，第二路 getUserMedia 要么直接失败，
  //      要么"成功"了但悄悄给你的还是原来那颗摄像头。
  //   2) facingMode 传的是"理想值"（ideal），浏览器允许在满足不了的时候
  //      自己决定给哪颗——所以有些设备上这个请求"成功"了，但给的根本不是
  //      你要的那颗，看起来就像"点了没反应"。
  // 改成：先停旧的再开新的；facingMode 用 exact 强制要求，满足不了就抛
  // OverconstrainedError，那样才能分清"真的切换失败"和"设备只有一颗摄像头"，
  // 后一种情况再退化成不带 exact 的请求兜底。
  async function flipCamera(){
    if(!callState || !callState.video || !callState.localStream) return;
    const nextFacing = currentCameraFacing==='user' ? 'environment' : 'user';
    const oldTrack = callState.localStream.getVideoTracks()[0];
    oldTrack?.stop(); // 先关掉旧摄像头——很多手机不支持同时打开两路摄像头
    let newStream;
    try{
      newStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:nextFacing}}});
    }catch(e){
      // exact约束在这台设备上满足不了（比如压根没有后置摄像头）——退回不带
      // exact的约束再试一次；这次还是拿不到，说明这台设备确实没法切换
      try{ newStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:nextFacing}}); }
      catch(e2){
        showToast(currentLang==='zh'?'切换摄像头失败':'Failed to switch camera');
        // 旧轨道已经停了，画面会黑掉——把它加回去总比什么都没有强
        if(oldTrack) callState.localStream.addTrack(oldTrack);
        return;
      }
    }
    currentCameraFacing = nextFacing;
    const newTrack = newStream.getVideoTracks()[0];
    const sender = callState.senders.find(s=> s.track && s.track.kind==='video');
    if(sender) await sender.replaceTrack(newTrack);
    callState.localStream.removeTrack(oldTrack);
    callState.localStream.addTrack(newTrack);
    // 不调用 renderCallOverlay()——本地video元素的srcObject还是同一个
    // MediaStream对象引用，只是里面的轨道换了，浏览器会自动接着播新轨道，
    // 整屏重渲染只会平白导致画面卡顿/闪烁（也是之前的bug之一）。
  }

  // 静音/取消静音——只更新按钮本身的图标和高亮状态，不整屏重渲染（视频通话时
  // 整屏重渲染会把两个<video>元素重新创建一遍，跟点小窗口/背景是同一类卡顿问题）
  function toggleMute(){
    const track = callState?.localStream?.getAudioTracks()[0];
    if(!track) return;
    track.enabled = !track.enabled;
    updateCallButtonStates();
  }
  // 开关摄像头（视频通话时）——同样只更新按钮本身
  function toggleCamera(){
    const track = callState?.localStream?.getVideoTracks()[0];
    if(!track) return;
    track.enabled = !track.enabled;
    updateCallButtonStates();
  }
  function updateCallButtonStates(){
    if(!callState) return;
    const muted = callState.localStream && callState.localStream.getAudioTracks()[0] && !callState.localStream.getAudioTracks()[0].enabled;
    const camOff = callState.video && callState.localStream && callState.localStream.getVideoTracks()[0] && !callState.localStream.getVideoTracks()[0].enabled;
    const muteBtn = document.getElementById('call-mute-btn');
    if(muteBtn){ muteBtn.classList.toggle('call-btn-active', !!muted); muteBtn.innerHTML = icon(muted?'micOff':'mic'); }
    const camBtn = document.getElementById('call-cam-btn');
    if(camBtn){ camBtn.classList.toggle('call-btn-active', !!camOff); camBtn.innerHTML = icon(camOff?'camOff':'video'); }
  }

  // 收尾：关摄像头/麦克风、把音视频轨道从连接上摘掉（数据通道本身不受影响，
  // 挂完电话之后聊天消息还是继续走这条直连）、清空状态、关掉悬浮窗，并且把
  // 那条通话记录消息更新成最终状态。status 不传的话自动判断：通话中→已结束
  // （算好时长），呼出还没接通→已取消，来电还没接→未接听。
  function teardown(status){
    if(!callState) return;
    stopRingLoop();
    if(callState.timerId) clearInterval(callState.timerId);
    if(callState.autoHideTimer) clearTimeout(callState.autoHideTimer);
    if(!status){
      status = callState.status==='active' ? 'ended' : (callState.direction==='outgoing' ? 'cancelled' : 'missed');
    }
    playCallSound('end');
    const duration = callState.startedAt ? Math.round((Date.now()-callState.startedAt)/1000) : 0;
    updateCallMessage(callState.callMsgId, callState.convId, {status, duration});
    callState.localStream?.getTracks().forEach(tr=> tr.stop());
    callState.senders.forEach(sender=>{ try{ callState.pc.removeTrack(sender); }catch(e){} });
    callState = null;
    remoteStream = null;
    document.getElementById('call-overlay')?.remove();
  }

  function startTimer(){
    callState.timerId = setInterval(()=>{
      const el = document.getElementById('call-timer');
      if(el && callState?.startedAt) el.textContent = formatDuration(Date.now()-callState.startedAt);
    }, 1000);
  }
  function formatDuration(ms){
    const s = Math.floor(ms/1000);
    return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  }

  // 收到对方经P2P信令通道转发来的通话控制消息（邀请/接受/拒绝/挂断/忙线）
  function handleCallSignal(peerUid, signal){
    if(signal.t === 'call-invite'){
      if(callState){ P2P.sendSignal(peerUid, {t:'call-busy'}); return; } // 我正在别的通话里，直接告诉对方忙线
      callState = { peerUid, video: !!signal.video, status:'incoming', direction:'incoming', convId:null, callMsgId:null,
        localStream:null, pc: P2P.getPeerConnection(peerUid), senders:[], startedAt:null, timerId:null, controlsHidden:false, mainIsRemote:true };
      playCallSound('incoming');
      ensureConvoWithFriend(peerUid).then(convo=>{
        if(!callState || callState.peerUid!==peerUid) return; // 这段时间里通话可能已经结束了
        callState.convId = convo.id;
        logCallMessage(peerUid, callState.video, 'incoming', 'ringing').then(msgId=>{ if(callState && callState.peerUid===peerUid) callState.callMsgId = msgId; });
      });
      renderCallOverlay();
    } else if(signal.t === 'call-accept'){
      if(callState && callState.peerUid===peerUid && callState.status==='calling'){
        callState.status = 'active';
        callState.startedAt = Date.now();
        startTimer();
        playCallSound('connect');
        renderCallOverlay();
        if(callState.video) setControlsHidden(false);
      }
    } else if(signal.t === 'call-decline'){
      if(callState && callState.peerUid===peerUid){
        showToast(currentLang==='zh'?'对方拒绝了通话':'Call declined');
        teardown('declined');
      }
    } else if(signal.t === 'call-busy'){
      if(callState && callState.peerUid===peerUid){
        showToast(currentLang==='zh'?'对方正忙':'They are on another call');
        teardown('busy');
      }
    } else if(signal.t === 'call-end'){
      if(callState && callState.peerUid===peerUid){
        showToast(currentLang==='zh'?'通话已结束':'Call ended');
        teardown(); // 自动判断：接通过就是已结束(算时长)，还没接就是未接听
      }
    }
  }
  P2P.setCustomSignalHandler(handleCallSignal);

  // 收到对方的音频/视频轨道——接到对应的 <video>/<audio> 标签上播放出来
  function handleRemoteTrack(peerUid, ev){
    if(!callState || callState.peerUid!==peerUid) return;
    remoteStream = ev.streams[0] || remoteStream;
    const videoEl = document.getElementById('call-remote-video');
    const audioEl = document.getElementById('call-remote-audio');
    if(videoEl) videoEl.srcObject = remoteStream;
    if(audioEl) audioEl.srcObject = remoteStream;
  }
  P2P.setRemoteTrackHandler(handleRemoteTrack);

  // 底层直连意外断掉（比如对方掉线）——如果正好在通话，直接收掉，不留一个已经失效的悬浮窗
  P2P.setPeerClosedHandler((peerUid)=>{
    if(callState && callState.peerUid===peerUid){
      showToast(currentLang==='zh'?'连接已断开，通话结束':'Connection lost — call ended');
      teardown();
    }
  });

  // 渲染通话悬浮窗——来电/呼叫中/通话中三种状态，样式框在CSS里单独一块（搜索 call-overlay-root）
  function renderCallOverlay(){
    let el = document.getElementById('call-overlay');
    if(!el){ el = document.createElement('div'); el.id = 'call-overlay'; document.body.appendChild(el); }
    if(!callState){ el.remove(); return; }
    el.className = 'call-overlay-root';
    const profile = senderProfileFor(callState.peerUid);
    const name = escapeHtml(profile.remark || profile.nickname);
    // 通话类型图标——语音/视频用不同图标+底色，来电/呼叫中一眼就能看出是哪种，
    // 不用非得读那行文字
    const typeBadge = `<div class="call-type-badge ${callState.video?'video':'voice'}">${icon(callState.video?'video':'phone')}</div>`;
    let bodyHtml = '';
    if(callState.status === 'incoming'){
      bodyHtml = `
        <div class="call-avatar">${avatarHtml(profile,'large')}${typeBadge}</div>
        <div class="call-name">${name}</div>
        <div class="call-status">${callState.video?(currentLang==='zh'?'邀请你视频通话':'Incoming video call'):(currentLang==='zh'?'邀请你语音通话':'Incoming voice call')}</div>
        <div id="call-ad-slot"></div>
        <div class="call-actions">
          <button class="call-btn call-btn-decline" id="call-decline-btn">${icon('hangup')}</button>
          <button class="call-btn call-btn-accept" id="call-accept-btn">${icon('phone')}</button>
        </div>`;
    } else if(callState.status === 'calling'){
      bodyHtml = `
        <div class="call-avatar">${avatarHtml(profile,'large')}${typeBadge}</div>
        <div class="call-name">${name}</div>
        <div class="call-status">${currentLang==='zh'?'正在呼叫…':'Calling…'}</div>
        <div id="call-ad-slot"></div>
        <div class="call-actions">
          <button class="call-btn call-btn-decline" id="call-hangup-btn">${icon('hangup')}</button>
        </div>`;
    } else { // active
      const muted = callState.localStream && callState.localStream.getAudioTracks()[0] && !callState.localStream.getAudioTracks()[0].enabled;
      const camOff = callState.video && callState.localStream && callState.localStream.getVideoTracks()[0] && !callState.localStream.getVideoTracks()[0].enabled;
      const hideCls = (callState.video && callState.controlsHidden) ? ' controls-hidden' : '';
      const controlsHtml = `
        <div class="call-name${hideCls}" id="call-name-line">${name}</div>
        <div class="call-status${hideCls}" id="call-timer">00:00</div>
        <div class="call-actions${hideCls}" id="call-actions-bar">
          <button class="call-btn ${muted?'call-btn-active':''}" id="call-mute-btn">${icon(muted?'micOff':'mic')}</button>
          ${callState.video?`<button class="call-btn ${camOff?'call-btn-active':''}" id="call-cam-btn">${icon(camOff?'camOff':'video')}</button>`:''}
          ${callState.video?`<button class="call-btn" id="call-flip-btn">${icon('flip')}</button>`:''}
          <button class="call-btn call-btn-decline" id="call-hangup-btn">${icon('hangup')}</button>
        </div>`;
      // 通话中界面（视频）只在这里"整体挂载"一次；后续单纯的"隐藏/显示按钮"
      // 或"大小画面互换"都不会再走这个整屏渲染，改成直接改现有DOM元素的
      // class（见 setControlsHidden / swapMainPip），否则每次点一下都要重新
      // 创建<video>元素，画面会跟着闪一下、卡一下（这正是之前的bug）。
      // 视频通话用"视频层+按钮层"两个显式分开的容器（见CSS里的
      // .call-video-layer / .call-controls-layer），按钮层永远盖在视频层
      // 上面，不会再出现"改了视频层样式结果把按钮盖住"的问题。
      if(callState.video){
        bodyHtml = `
          <div class="call-video-layer">
            <video id="call-remote-video" autoplay playsinline class="${videoClassFor(callState.mainIsRemote)}"></video>
            <video id="call-local-video" autoplay playsinline muted class="${videoClassFor(!callState.mainIsRemote)}"></video>
          </div>
          <div class="call-controls-layer">${controlsHtml}</div>`;
      } else {
        bodyHtml = `
          <audio id="call-remote-audio" autoplay></audio>
          <div class="call-avatar">${avatarHtml(profile,'large')}${typeBadge}</div>
          ${controlsHtml}`;
      }
    }
    el.innerHTML = bodyHtml;
    // 通话广告——只在还没接通（呼叫中/来电）的等待阶段展示，呼叫方和被叫方
    // 都能看到；接通('active')之后的模板里压根没有这个广告位div，用户接通
    // 后就看不到广告了，不打扰通话本身。见 ads.js 的 renderCallAd。
    if(callState.status==='incoming' || callState.status==='calling'){
      window.AdManager?.renderCallAd(document.getElementById('call-ad-slot'));
    }
    document.getElementById('call-decline-btn')?.addEventListener('click', decline);
    document.getElementById('call-accept-btn')?.addEventListener('click', accept);
    document.getElementById('call-hangup-btn')?.addEventListener('click', hangup);
    document.getElementById('call-mute-btn')?.addEventListener('click', toggleMute);
    document.getElementById('call-cam-btn')?.addEventListener('click', toggleCamera);
    document.getElementById('call-flip-btn')?.addEventListener('click', (e)=>{ e.stopPropagation(); flipCamera(); });
    // 点一下屏幕背景，隐藏/显示按钮和文字，跟微信一样；点按钮本身不算数（下面
    // stopPropagation）。改成只切class，不整屏重渲染。
    if(callState.status==='active' && callState.video){
      el.onclick = ()=> setControlsHidden(!callState.controlsHidden);
      el.querySelectorAll('.call-actions button').forEach(b=> b.addEventListener('click', (e)=> e.stopPropagation()));
      // 点小窗口（当前处于pip位置的那个视频）切换大小画面，跟微信一样；
      // 这里同样只改现有元素的class，不重新创建<video>，避免画面卡顿/闪烁。
      // 只有点的正好是当前"小窗口"那个视频时才拦截+触发切换；点的是当前
      // "大画面"那个，就让事件正常冒泡上去触发上面的隐藏/显示按钮逻辑。
      document.getElementById('call-remote-video')?.addEventListener('click', (e)=>{
        if(!callState.mainIsRemote){ e.stopPropagation(); swapMainPip(); }
      });
      document.getElementById('call-local-video')?.addEventListener('click', (e)=>{
        if(callState.mainIsRemote){ e.stopPropagation(); swapMainPip(); }
      });
    } else {
      el.onclick = null;
    }
    if(callState.status==='active'){
      if(callState.video){
        const rv = document.getElementById('call-remote-video'), lv = document.getElementById('call-local-video');
        if(rv && remoteStream) rv.srcObject = remoteStream;
        if(lv && callState.localStream) lv.srcObject = callState.localStream;
      } else {
        const ra = document.getElementById('call-remote-audio');
        if(ra && remoteStream) ra.srcObject = remoteStream;
      }
    }
  }

  // 视频元素当前该用"大画面"还是"小窗口"样式；小窗口那个额外叠一个
  // controls-hidden（隐藏按钮的时候小窗口跟着一起隐藏，大画面永远保留）
  // 小窗口（自拍那个PIP）永远不跟着按钮一起隐藏——只有下面的挂断/静音/翻转
  // 摄像头这些按钮和名字/计时文字才会在点击屏幕后收起去，小窗口画面本身
  // 应该始终看得见（这是之前的一个bug：之前小窗口也套了controls-hidden，
  // 点一下屏幕连自己的画面都被隐藏了，这是不对的）。
  function videoClassFor(isMain){
    // return isMain ? 'call-video-big' : 'call-video-pip';
    // isMain=false → 本地自拍画面，scaleX(-1)水平翻转
    return isMain ? 'call-video-big' : 'call-video-pip mirror-local';
  }
  // 只改两个<video>元素的class（大小画面互换），不碰innerHTML、不重新创建
  // 元素、不重新赋值srcObject——这是修复"点小窗口画面就卡住/闪烁"的关键：
  // 之前是整个悬浮窗重新渲染，两个<video>被销毁重建，浏览器要重新解码，
  // 才会看起来卡一下、闪一下。
  function swapMainPip(){
    if(!callState || !callState.video) return;
    callState.mainIsRemote = !callState.mainIsRemote;
    const rv = document.getElementById('call-remote-video'), lv = document.getElementById('call-local-video');
    if(rv) rv.className = videoClassFor(callState.mainIsRemote);
    if(lv) lv.className = videoClassFor(!callState.mainIsRemote);
  }
  // 隐藏/显示按钮和文字——同样只改现有元素的class，不整屏重渲染。
  // 跟微信一样：接通后过几秒自动隐藏一次；点一下屏幕可以随时手动切换，
  // 手动"显示"出来之后会重新计时，过几秒还是会自动收起去。
  // 隐藏/显示按钮和名字/计时文字——只切这三个元素的class，不碰两个<video>
  // 元素（小窗口画面永远保持可见，不跟着一起隐藏）。跟微信一样：接通后过
  // 几秒自动隐藏一次；点一下屏幕可以随时手动切换，手动"显示"出来之后会
  // 重新计时，过几秒还是会自动收起去。
  function setControlsHidden(hidden){
    if(!callState) return;
    callState.controlsHidden = hidden;
    clearTimeout(callState.autoHideTimer);
    ['call-name-line','call-timer','call-actions-bar'].forEach(id=>{
      const elx = document.getElementById(id);
      if(elx) elx.classList.toggle('controls-hidden', hidden);
    });
    if(!hidden){
      callState.autoHideTimer = setTimeout(()=>{ if(callState && callState.status==='active') setControlsHidden(true); }, 4000);
    }
  }

  // 退出登录时如果还有通话在进行，直接挂断，不留后台占用摄像头/麦克风
  function forceEndAll(){ if(callState) teardown(); }

  return { start, accept, decline, hangup, toggleMute, toggleCamera, flipCamera, forceEndAll };
})();
